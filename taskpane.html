<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Summation Assistant</title>
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
  <style>
    /* ── Summation Assistant — brand shell (v9.5 logic untouched) ───────── */
    :root{
      --green:#408F4E; --green-dark:#2D6B38; --green-pale:#EDF7EE;
      --grey-900:#2B2B2B; --grey-600:#646464; --grey-400:#909090;
      --grey-500:#787878; --grey-300:#B4B4B4; --grey-200:#DCDCDC; --grey-100:#EFEFEF; --grey-50:#F7F7F7;
      --font-display:'Bahnschrift','DIN Alternate','Segoe UI',sans-serif;
      --font-body:'Calibri','Segoe UI',system-ui,sans-serif;
      --font-mono:'Consolas','Courier New',monospace;
    }
    *{box-sizing:border-box}
    body{margin:0;padding:76px 0 40px;background:#fff;font-family:var(--font-body);
         font-size:13px;line-height:1.5;color:var(--grey-600);-webkit-font-smoothing:antialiased}
    a{color:var(--green-dark);text-decoration:none}
    a:hover{color:var(--green);text-decoration:underline}
    hr{border:none;border-top:1px solid var(--grey-100);margin:18px 0}
    #signInPrompt,#appBody{padding:16px 18px}

    /* ── Brand band + intro ────────────────────────────────────────────── */
    #brandBar{position:fixed;top:0;left:0;right:0;height:76px;background:var(--grey-900);
      z-index:50;overflow:hidden;pointer-events:none;
      animation:morphBlock 2100ms cubic-bezier(.4,0,.2,1) both}
    #brandLockup{position:absolute;left:20px;top:22px;display:flex;align-items:center;gap:11px;
      transform-origin:left top;animation:morphLockup 2100ms cubic-bezier(.4,0,.2,1) both}
    #brandLockup img{width:28px;height:auto;display:block;
      animation:symIn 560ms cubic-bezier(.2,.6,.2,1) both}
    #brandWord{font-size:13px;font-weight:600;color:#fff;letter-spacing:.18em;
      animation:wordIn 680ms cubic-bezier(.2,.6,.2,1) 200ms both}
    #brandSub{display:flex;align-items:center;gap:8px;margin-top:4px;
      animation:fadeIn 420ms ease 620ms both}
    #brandSub span{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--grey-400)}
    #brandSub i{flex:1;height:1px;background:var(--green);transform-origin:left;
      animation:ruleIn 520ms cubic-bezier(.2,.6,.2,1) 700ms both}
    #brandUser{position:absolute;right:20px;top:26px;display:flex;align-items:center;gap:6px;
      font-size:10px;color:var(--grey-200);animation:fadeIn 420ms ease 1600ms both}
    #brandUser b{flex:none;width:6px;height:6px;border-radius:50%;background:#5AAD68;
      animation:dotPulse 3.6s ease-in-out 2.4s infinite}

    @keyframes morphBlock{0%,52%{height:100vh}100%{height:76px}}
    @keyframes morphLockup{
      0%,52%{transform:translate(calc(50vw - 85% - 20px),calc(50vh - 85% - 22px)) scale(1.7)}
      100%{transform:none}}
    @keyframes symIn{from{opacity:0;transform:translateY(-6px) scale(.9)}to{opacity:1;transform:none}}
    @keyframes wordIn{from{opacity:0;transform:translateX(-10px);letter-spacing:.34em}
      to{opacity:1;transform:none;letter-spacing:.18em}}
    @keyframes ruleIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.3}}
    @media (prefers-reduced-motion:reduce){
      #brandBar,#brandLockup,#brandLockup img,#brandWord,#brandSub,#brandSub i,#brandUser,#brandUser b
        {animation-duration:1ms!important;animation-delay:0ms!important}}

    /* ── Form primitives (same block layout the script expects) ────────── */
    label{display:block;width:100%;margin:14px 0 6px;font-size:10px;letter-spacing:.09em;
      text-transform:uppercase;color:var(--grey-400)}
    input[type=text]{display:block;width:100%;margin:0 0 10px;padding:8px 10px;
      font:400 13px/1.4 var(--font-body);color:var(--grey-900);background:#fff;
      border:1.5px solid var(--grey-200);border-radius:4px}
    input[type=text]:focus{outline:none;border-color:var(--green)}
    button{display:block;width:100%;margin:0 0 9px;padding:10px 12px;
      font:600 13px/1.2 var(--font-body);letter-spacing:.04em;color:#fff;
      background:var(--green);border:1px solid var(--green);border-radius:4px;cursor:pointer;
      transition:background 100ms ease,border-color 100ms ease}
    button:hover{background:var(--green-dark);border-color:var(--green-dark)}
    button:disabled{background:var(--grey-100);border-color:var(--grey-200);color:var(--grey-500);cursor:not-allowed}
    .small-button{display:inline-block;width:auto;margin:0;padding:5px 10px;font-size:11px}
    .secondary-button{background:#fff;color:var(--grey-900);border:1px solid var(--grey-200)}
    .secondary-button:hover{background:#fff;border-color:var(--grey-400)}
    .section-label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;
      color:var(--grey-400);margin:0 0 8px}

    /* ── Action tiles ──────────────────────────────────────────────────── */
    #topActions{display:block;margin:0 0 18px}
    #newProjectButton,#convertProjectButton,#convertToArchiveButton,#searchMailboxButton{width:100%;margin:0 0 9px;padding:11px 12px;
      background:#fff;border:1px solid var(--grey-200);border-radius:10px;
      font-weight:400;color:inherit;transition:box-shadow 180ms ease,transform 180ms ease}
    #newProjectButton:hover,#convertProjectButton:hover,#convertToArchiveButton:hover,#searchMailboxButton:hover{background:#fff;
      border-color:var(--grey-200);transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.09)}
    .tile{display:flex;align-items:center;gap:11px;text-align:left}
    .tile .ico{flex:none;display:flex;align-items:center;justify-content:center;
      width:28px;height:28px;border-radius:4px;background:var(--green-pale)}
    #convertProjectButton .tile .ico,#convertToArchiveButton .tile .ico,#searchMailboxButton .tile .ico{background:var(--grey-100)}
    .tile .txt{display:block}
    .tile .txt b{display:block;font-size:13px;font-weight:600;color:var(--grey-900)}
    .tile .txt i{display:block;font-style:normal;font-size:10.5px;color:var(--grey-400);margin-top:2px}

    /* ── Folder lists ──────────────────────────────────────────────────── */
    #folderList,#cvFolderList{border:1px solid var(--grey-200);border-radius:10px;
      max-height:320px;overflow-y:auto;margin-top:6px}
    .folder-item{display:flex;justify-content:space-between;align-items:center;gap:10px;
      padding:9px 11px;border-bottom:1px solid var(--grey-100);cursor:pointer;font-size:13px;
      transition:background 100ms ease}
    .folder-item:last-child{border-bottom:none}
    .folder-item:hover{background:var(--grey-50)}
    .folder-item.selected{background:var(--green-pale);box-shadow:inset 2px 0 0 var(--green)}
    .folder-item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--grey-900)}
    .folder-item .tag{flex:none;font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;
      color:var(--grey-400);margin-left:8px;white-space:nowrap}
    .empty-message{padding:12px;color:var(--grey-400);font-size:12px}

    /* ── Status, hints, summaries ──────────────────────────────────────── */
    #statusMessage,#createStatusMessage,#npIntakeStatus,#npConfirmStatus,#cvBrowseStatus,#cvConfirmStatus{
      margin-top:8px;font-size:12px;color:var(--grey-600);white-space:pre-wrap}
    #selectedInfo{margin-top:10px;font-size:11.5px;color:var(--grey-400)}
    .hint{font-size:10.5px;color:var(--grey-400);margin:-4px 0 12px}
    #createMailboxSection{display:none}
    .summary-box{border:1px solid var(--grey-200);border-radius:10px;padding:12px;
      font-size:12.5px;margin-bottom:12px;background:#fff}
    .summary-box .row{margin-bottom:6px}
    .summary-box .row:last-child{margin-bottom:0}
    .summary-box .label{font-weight:600;color:var(--grey-900)}
    .warning-box{border:1px solid #E78707;background:#FFF8E1;color:#7A5B00;border-radius:4px;
      padding:10px;font-size:12px;margin-bottom:10px}

    .radio-row{display:flex;gap:16px;margin-bottom:10px}
    .radio-row label{display:flex;align-items:center;gap:6px;width:auto;margin:0;
      font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--grey-900)}
    .radio-row input{display:inline-block;width:auto;margin:0;accent-color:var(--green)}
    .name-candidate{display:inline-block;width:auto;margin:0 6px 6px 0;padding:6px 10px;
      background:#fff;color:var(--grey-900);border:1px solid var(--grey-200);border-radius:4px;
      cursor:pointer;font:400 12px/1.2 var(--font-body)}
    .name-candidate:hover{background:#fff;border-color:var(--grey-400)}
    .name-candidate.selected{background:var(--green);color:#fff;border-color:var(--green)}

    /* ── Sign-in ───────────────────────────────────────────────────────── */
    #signInPrompt{padding:48px 24px;text-align:center}
    #signInPrompt p{margin:0 0 20px;font-size:13px;color:var(--grey-600)}
    #signInButton{width:auto;min-width:150px;margin:0 auto;display:inline-block}

    /* ── Footer bar ────────────────────────────────────────────────────── */
    #versionDisplay{position:fixed;left:0;right:0;bottom:0;height:32px;display:flex;
      align-items:center;justify-content:flex-end;padding:0 18px;font-family:var(--font-mono);
      font-size:10px;color:var(--grey-300);background:var(--grey-50);
      border-top:1px solid var(--grey-100);z-index:40}
    #refreshButton{position:fixed;left:18px;bottom:0;height:32px;width:auto;margin:0;padding:0;
      display:flex;align-items:center;gap:5px;font:400 10px/1 var(--font-body);
      letter-spacing:.04em;text-transform:uppercase;color:var(--grey-400);
      background:none;border:none;cursor:pointer;z-index:41}
    #refreshButton:hover{color:var(--green);background:none}
  </style>
</head>
<body>
  <div id="brandBar">
    <div id="brandLockup">
      <img src="https://prassummation.github.io/outlook-addin/logo-symbol-80x80.png" alt="Summation" />
      <div>
        <div id="brandWord">SUMMATION</div>
        <div id="brandSub"><span>Assistant</span><i></i></div>
      </div>
    </div>
    <div id="brandUser"><b></b><span id="brandUserName">Signed in</span></div>
  </div>

  <div id="signInPrompt">
    <p style="text-align: center;">Please sign in to load project folders.</p>
    <button id="signInButton">Sign In</button>
  </div>

  <div id="appBody" style="display: none;">
    <div id="topActions">
      <div class="section-label">Actions</div>
      <button id="newProjectButton"><span class="tile"><span class="ico"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#408F4E" stroke-width="1.5"><path d="M7 2v10M2 7h10"/></svg></span><span class="txt"><b>New BD project</b><i>Allocate the next number and file this email</i></span></span></button>
      <button id="convertProjectButton"><span class="tile"><span class="ico"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#646464" stroke-width="1.5"><path d="M2 7h10M8.5 3.5 12 7l-3.5 3.5"/></svg></span><span class="txt"><b>Convert BD to project</b><i>Move an Archive folder into Active</i></span></span></button>
      <button id="convertToArchiveButton"><span class="tile"><span class="ico"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#646464" stroke-width="1.5"><path d="M12 7H2M5.5 3.5 2 7l3.5 3.5"/></svg></span><span class="txt"><b>Convert Active to Archive</b><i>Move a project folder from Active into Archive</i></span></span></button>
      <button id="searchMailboxButton"><span class="tile"><span class="ico"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#646464" stroke-width="1.5"><circle cx="6" cy="6" r="4"/><path d="M9.5 9.5 13 13"/></svg></span><span class="txt"><b>Search Shared Mailbox Online</b><i>Find any project mailbox and open it in Outlook Web</i></span></span></button>
    </div>

    <div id="folderBrowser" style="display: none;">
      <label for="filterBox">Filter projects and folders</label>
      <input type="text" id="filterBox" placeholder="Type to filter..." />
      <div id="folderList"></div>
      <div id="statusMessage"></div>
      <div id="selectedInfo"></div>

      <div id="createMailboxSection">
        <hr style="margin-top: 20px; margin-bottom: 20px;">
        <label for="newMailboxName">New shared mailbox name</label>
        <input type="text" id="newMailboxName" placeholder="e.g., SUPER25041_81 Quill Way" />
        <div class="hint">Tip: prefix with a project code (e.g. SUPER25041_) so it's recognized as a project mailbox.</div>
        <button id="createMailboxButton">Create New Shared Mailbox</button>
        <div id="createStatusMessage"></div>
      </div>
    </div>

    <div id="newProjectWizard" style="display: none;">
      <button id="backToBrowserButton" class="small-button secondary-button">&larr; Back</button>

      <div id="npStepIntake">
        <label>Service</label>
        <div class="radio-row">
          <label><input type="radio" name="npService" value="Sustainability" checked /> Sustainability</label>
          <label><input type="radio" name="npService" value="Energy" /> Energy</label>
        </div>
        <label>Location</label>
        <div class="radio-row">
          <label><input type="radio" name="npLocation" value="Perth" checked /> Perth</label>
          <label><input type="radio" name="npLocation" value="Adelaide" /> Adelaide</label>
        </div>
        <label>Project name</label>
        <div id="npNameCandidates"></div>
        <input type="text" id="npNameFreeText" placeholder="Or type a project name..." />
        <div id="npIntakeStatus"></div>
        <button id="npNextButton">Next</button>
      </div>

      <div id="npStepConfirm" style="display: none;">
        <div id="npConfirmSummary"></div>
        <div id="npConfirmStatus"></div>
        <button id="npConfirmButton">Confirm &amp; Create</button>
        <button id="npBackToIntakeButton" class="secondary-button">&larr; Edit Details</button>
      </div>

      <div id="npStepResult" style="display: none;">
        <div id="npResultSummary"></div>
        <button id="npStartOverButton">Start Another</button>
      </div>
    </div>

    <div id="convertWizard" style="display: none;">
      <button id="cvBackToBrowserButton" class="small-button secondary-button">&larr; Back</button>

      <div id="cvStepBrowse">
        <label>Service</label>
        <div class="radio-row">
          <label><input type="radio" name="cvService" value="Sustainability" checked /> Sustainability</label>
          <label><input type="radio" name="cvService" value="Energy" /> Energy</label>
        </div>
        <label for="cvFilterBox">Filter archive project folders</label>
        <input type="text" id="cvFilterBox" placeholder="Type to filter..." />
        <div id="cvFolderList"></div>
        <div id="cvBrowseStatus"></div>
      </div>

      <div id="cvStepConfirm" style="display: none;">
        <div id="cvConfirmSummary"></div>
        <div id="cvConfirmStatus"></div>
        <button id="cvConfirmButton">Confirm &amp; Convert</button>
        <button id="cvBackToBrowseButton" class="secondary-button">&larr; Choose a Different Folder</button>
      </div>

      <div id="cvStepResult" style="display: none;">
        <div id="cvResultSummary"></div>
        <button id="cvStartOverButton">Convert Another</button>
      </div>
    </div>

    <div id="convertToArchiveWizard" style="display: none;">
      <button id="caBackToBrowserButton" class="small-button secondary-button">&larr; Back</button>

      <div id="caStepBrowse">
        <label>Service</label>
        <div class="radio-row">
          <label><input type="radio" name="caService" value="Sustainability" checked /> Sustainability</label>
          <label><input type="radio" name="caService" value="Energy" /> Energy</label>
        </div>
        <label for="caFilterBox">Filter active project folders</label>
        <input type="text" id="caFilterBox" placeholder="Type to filter..." />
        <div id="caFolderList"></div>
        <div id="caBrowseStatus"></div>
      </div>

      <div id="caStepConfirm" style="display: none;">
        <div id="caConfirmSummary"></div>
        <div id="caConfirmStatus"></div>
        <button id="caConfirmButton">Confirm &amp; Convert</button>
        <button id="caBackToBrowseButton" class="secondary-button">&larr; Choose a Different Folder</button>
      </div>

      <div id="caStepResult" style="display: none;">
        <div id="caResultSummary"></div>
        <button id="caStartOverButton">Convert Another</button>
      </div>
    </div>

    <div id="searchMailboxWizard" style="display: none;">
      <button id="smBackToBrowserButton" class="small-button secondary-button">&larr; Back</button>

      <label>Service</label>
      <div class="radio-row">
        <label><input type="radio" name="smService" value="Sustainability" checked /> Sustainability</label>
        <label><input type="radio" name="smService" value="Energy" /> Energy</label>
      </div>
      <label for="smFilterBox">Search shared mailboxes</label>
      <input type="text" id="smFilterBox" placeholder="Type to search..." />
      <div id="smMailboxList"></div>
      <div id="smStatus"></div>
    </div>
  </div>

  <button id="refreshButton" title="Refresh Add-in"><span aria-hidden="true">&#x21bb;</span>Refresh</button>
  <div id="versionDisplay"></div>

  <script>
    const APP_VERSION = "9.10";

    let msalInstance;
    let folderEntries = [];
    let selectedEntry = null;
    let npState = {};
    let cvState = {};
    let caState = {};
    let activeFolderEntries = [];
    let sharedMailboxSearchEntries = [];
    let archiveFolderEntries = [];

    const SITE_ID = "summationptyltd.sharepoint.com,b0a8b5e8-0c27-4b46-a97f-e9f7668c3021,039ea15c-5b24-4eea-b48a-9f4e61e9439c";
    const ACTIVE_DRIVE_ID = "b!6LWosCcMRkupf-n3ZowwIVyhngMkW-pOtIqfTmHpQ5wp-OK02_E3RbZkRH_jE_Lr";
    const ARCHIVE_DRIVE_ID = "b!6LWosCcMRkupf-n3ZowwIVyhngMkW-pOtIqfTmHpQ5zGiD4R7k2PQZMwL6mUreXS";
    const TEMPLATE_PATH = "Sustainability/Perth/SUPER00000_Project_Template";

    // Branch folder is not the same path in both libraries — see brief §2.1.
    const ACTIVE_BRANCH_PATH = {
        SUPER: "Sustainability/Perth",
        SUADL: "Sustainability/Adelaide",
        ENPER: "Energy/Perth",
        ENADL: "Energy/Adelaide"
    };
    const ARCHIVE_BRANCH_PATH = {
        SUPER: "Sustainability/Perth",
        SUADL: "Sustainability/Archived_Adelaide",
        ENPER: "Energy/Perth",
        ENADL: "Energy/Adelaide"
    };

    const msalConfig = {
      auth: {
        clientId: "80497ed0-ecd5-475e-97e0-5c9e90fb8a0d",
        authority: "https://login.microsoftonline.com/ecb5f458-9548-4e8b-96f3-904f1828f931",
        redirectUri: window.location.origin + window.location.pathname
      },
      // localStorage (not the default sessionStorage) so sign-in survives the taskpane
      // being closed/reopened, not just a single Outlook session.
      cache: {
        cacheLocation: "localStorage",
        storeAuthStateInCookie: false
      }
    };

    // Scopes for Microsoft Graph
    const graphRequest = {
        scopes: ["User.Read", "Mail.Read", "Directory.Read.All"]
    };
    // Only requested on demand, when creating a shared mailbox.
    const directoryWriteRequest = {
        scopes: ["Directory.ReadWrite.All"]
    };
    // Only requested on demand, when using the New Project wizard.
    const sitesRequest = {
        scopes: ["Sites.Selected"]
    };

    Office.onReady(appInit);

    function appInit() {
        document.getElementById("versionDisplay").innerText = `Version: ${APP_VERSION}`;
        document.getElementById("refreshButton").addEventListener("click", () => { window.location.reload(true); });
        document.getElementById("signInButton").addEventListener("click", handleLogin);
        document.getElementById("filterBox").addEventListener("input", () => renderFolderList(document.getElementById("filterBox").value));
        document.getElementById("createMailboxButton").addEventListener("click", createSharedMailbox);
        document.getElementById("newProjectButton").addEventListener("click", openNewProjectWizard);
        document.getElementById("backToBrowserButton").addEventListener("click", closeNewProjectWizard);
        document.getElementById("npNextButton").addEventListener("click", handleIntakeNext);
        document.getElementById("npBackToIntakeButton").addEventListener("click", () => showWizardStep("intake"));
        document.getElementById("npConfirmButton").addEventListener("click", handleConfirmCreate);
        document.getElementById("npStartOverButton").addEventListener("click", openNewProjectWizard);
        document.getElementById("convertProjectButton").addEventListener("click", openConvertWizard);
        document.getElementById("cvBackToBrowserButton").addEventListener("click", closeConvertWizard);
        document.getElementById("cvFilterBox").addEventListener("input", () => renderArchiveFolderList(document.getElementById("cvFilterBox").value));
        document.querySelectorAll('input[name="cvService"]').forEach(el =>
            el.addEventListener("change", () => renderArchiveFolderList(document.getElementById("cvFilterBox").value))
        );
        document.getElementById("cvBackToBrowseButton").addEventListener("click", () => showConvertStep("browse"));
        document.getElementById("cvConfirmButton").addEventListener("click", handleConvertConfirm);
        document.getElementById("cvStartOverButton").addEventListener("click", openConvertWizard);
        document.getElementById("convertToArchiveButton").addEventListener("click", openConvertToArchiveWizard);
        document.getElementById("caBackToBrowserButton").addEventListener("click", closeConvertToArchiveWizard);
        document.getElementById("caFilterBox").addEventListener("input", () => renderActiveFolderList(document.getElementById("caFilterBox").value));
        document.querySelectorAll('input[name="caService"]').forEach(el =>
            el.addEventListener("change", () => renderActiveFolderList(document.getElementById("caFilterBox").value))
        );
        document.getElementById("caBackToBrowseButton").addEventListener("click", () => showConvertToArchiveStep("browse"));
        document.getElementById("caConfirmButton").addEventListener("click", handleConvertToArchiveConfirm);
        document.getElementById("caStartOverButton").addEventListener("click", openConvertToArchiveWizard);
        document.getElementById("searchMailboxButton").addEventListener("click", openSearchMailboxWizard);
        document.getElementById("smBackToBrowserButton").addEventListener("click", closeSearchMailboxWizard);
        document.getElementById("smFilterBox").addEventListener("input", () => renderSharedMailboxSearchList(document.getElementById("smFilterBox").value));
        document.querySelectorAll('input[name="smService"]').forEach(el =>
            el.addEventListener("change", () => renderSharedMailboxSearchList(document.getElementById("smFilterBox").value))
        );

        if (typeof msal !== 'undefined' && msal.PublicClientApplication) {
            msalInstance = new msal.PublicClientApplication(msalConfig);
            attemptSilentSignIn();
        } else {
            document.getElementById("signInPrompt").innerHTML = "<p>Error: Could not load authentication library.</p>";
        }
    }

    function showAppUi(show) {
        document.getElementById("appBody").style.display = show ? "block" : "none";
        document.getElementById("signInPrompt").style.display = show ? "none" : "block";
    }

    async function handleLogin() {
        updateStatus("Please sign in using the pop-up window...");
        try {
            const loginResponse = await msalInstance.loginPopup(graphRequest);
            msalInstance.setActiveAccount(loginResponse.account);

            showAppUi(true);
            setTimeout(() => document.getElementById("filterBox").focus(), 100);
            await loadFolders();
        } catch (error) {
            console.error("Interactive sign in failed:", error);
            updateStatus("Sign in failed. Please try again.", true);
            showAppUi(false);
        }
    }

    async function attemptSilentSignIn() {
        try {
            const token = await signInAndGetToken(graphRequest, false);
            if (token) {
                showAppUi(true);
                setTimeout(() => document.getElementById("filterBox").focus(), 100);
                await loadFolders();
            } else {
                showAppUi(false);
            }
        } catch (error) {
            console.log("Silent sign-in failed, user interaction required.", error);

    async function signInAndGetToken(request, isUserAction = false) {
        const account = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0];
        if (account) {
            try {
                const silentResponse = await msalInstance.acquireTokenSilent({ ...request, account });
                return silentResponse.accessToken;
            } catch (error) {
                if (error instanceof msal.InteractionRequiredAuthError && isUserAction) {
                    const interactiveResponse = await msalInstance.acquireTokenPopup(request);
                    return interactiveResponse.accessToken;
                }
                throw error;
            }
        }
        if (isUserAction) {
            const loginResponse = await msalInstance.loginPopup(request);
            msalInstance.setActiveAccount(loginResponse.account);
            return loginResponse.accessToken;
        }
        return null;
    }

    // All subfolders (any depth) under the signed-in user's own Inbox.
    async function getAllInboxSubfolders(token) {
        const inbox = await graphGet(
            "https://graph.microsoft.com/v1.0/me/mailFolders/inbox?$select=id,displayName",
            token
        );
        return fetchChildFolders(inbox.id, [], token, "own");
    }

    async function fetchChildFolders(folderId, parentPath, token, type) {
        const children = [];
        let url = `https://graph.microsoft.com/v1.0/me/mailFolders/${folderId}/childFolders?$select=id,displayName,childFolderCount&$top=100`;
        while (url) {
            const data = await graphGet(url, token);
            children.push(...data.value);
            url = data["@odata.nextLink"] || null;
        }
        children.sort((a, b) => a.displayName.localeCompare(b.displayName));

        const results = [];
        for (const folder of children) {
            const path = [...parentPath, folder.displayName];
            results.push({ path, depth: path.length - 1, type });
            if (folder.childFolderCount > 0) {
                const nested = await fetchChildFolders(folder.id, path, token, type);
                results.push(...nested);
            }
        }
        return results;
    }

    // Shared/project mailboxes are represented by a single entry for their Inbox.
    async function getSharedMailboxes(token) {
        const url = "https://graph.microsoft.com/v1.0/users?$select=displayName,mail,userPrincipalName,assignedLicenses&$top=999";
        const data = await graphGet(url, token);
        const projectMailboxRegex = /^[a-zA-Z]{5}\d{5}_.*@summation\.au$/i;
        const sharedMailboxes = data.value.filter(user =>
            user.assignedLicenses.length === 0 && user.mail && projectMailboxRegex.test(user.mail)
        );
        return sharedMailboxes
            .map(user => ({ path: [user.mail.split("@")[0], "Inbox"], depth: 0, type: "shared", mail: user.mail }))
            .sort((a, b) => a.path[0].localeCompare(b.path[0]));
    }

    function base64ToBytes(base64) {
        const binary = atob(base64);

        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;

    function populateNameCandidates() {
        const container = document.getElementById("npNameCandidates");
        container.innerHTML = "";
        const item = getCurrentMailItem();
        if (!item) return;

        const candidates = new Set();
        const fromName = item.from && item.from.displayName ? item.from.displayName.trim() : "";
        if (fromName) candidates.add(fromName);

        const fromEmail = item.from && item.from.emailAddress ? item.from.emailAddress : "";
        const domainMatch = fromEmail.match(/@([^.]+)\./);
        if (domainMatch) {
            candidates.add(domainMatch[1].charAt(0).toUpperCase() + domainMatch[1].slice(1));
        }

        const subject = (item.subject || "").replace(/^(re|fw|fwd)\s*:\s*/i, "").trim();
        if (subject) candidates.add(subject);

        getItemBodyText(item).then(bodyText => {
            const addressMatch = (bodyText || "").match(/\d+[a-zA-Z]?\s+[A-Za-z'\s]+\b(Street|St|Road|Rd|Avenue|Ave|Drive|Dr|Court|Ct|Way|Place|Pl|Terrace|Tce|Highway|Hwy)\b/i);
            if (addressMatch) candidates.add(addressMatch[0].trim());
            renderNameCandidates(Array.from(candidates).slice(0, 4));
        }).catch(() => {
            renderNameCandidates(Array.from(candidates).slice(0, 4));
        });
    }

    async function listFolders(driveId, path, token) {
        const data = await graphGetOrNull(
            `https://graph.microsoft.com/v1.0/drives/${driveId}/root:/${encodePath(path)}:/children?$select=name,folder&$top=999`,
            token

    // Next number for a combo+year = (highest NNN used anywhere for that combo+year,
    // across BOTH libraries) + 1. Templates are excluded by name, not by hardcoded number.
    async function getNextProjectNumber(token, combo) {
        const yy = String(new Date().getFullYear() % 100).padStart(2, "0");
        const [activeFolders, archiveFolders] = await Promise.all([
            listFolders(ACTIVE_DRIVE_ID, ACTIVE_BRANCH_PATH[combo], token),
            listFolders(ARCHIVE_DRIVE_ID, ARCHIVE_BRANCH_PATH[combo], token)
        ]);

        const codePattern = new RegExp(`^${combo}(\\d{2})(\\d{3})`, "i");
        const seenThisYear = {};
        let maxNNN = 0;

        [...activeFolders, ...archiveFolders].forEach(folder => {
            if (/template/i.test(folder.name)) return;
            const match = folder.name.match(codePattern);
            if (!match || match[1] !== yy) return;
            const nnn = parseInt(match[2], 10);
            (seenThisYear[nnn] = seenThisYear[nnn] || []).push(folder.name);
            if (nnn > maxNNN) maxNNN = nnn;
        });

        const warnings = Object.entries(seenThisYear)
            .filter(([, names]) => names.length > 1)
            .map(([nnn, names]) => `Number ${combo}${yy}${String(nnn).padStart(3, "0")} is already used by more than one folder: ${names.join(", ")}`);

        return { yy, nextNNN: maxNNN + 1, warnings };
    }

    async function createFolder(driveId, parentId, name, token) {
        const createUrl = parentId
            ? `https://graph.microsoft.com/v1.0/drives/${driveId}/items/${parentId}/children`
            : `https://graph.microsoft.com/v1.0/drives/${driveId}/root/children`;
        const response = await fetch(createUrl, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ name, folder: {}, "@microsoft.graph.conflictBehavior": "fail" })
        });
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Failed to create folder "${name}": ${response.status} - ${errorText}`);
        }
        return response.json();
    }

    async function getOrCreateBranchFolder(driveId, path, token) {
        const existing = await graphGetOrNull(`https://graph.microsoft.com/v1.0/drives/${driveId}/root:/${encodePath(path)}`, token);
        if (existing) return existing.id;

        const segments = path.split("/");
        let parentId = null;
        let builtPath = "";
        for (const segment of segments) {
            builtPath = builtPath ? `${builtPath}/${segment}` : segment;
            let folder = await graphGetOrNull(`https://graph.microsoft.com/v1.0/drives/${driveId}/root:/${encodePath(builtPath)}`, token);
            if (!folder) folder = await createFolder(driveId, parentId, segment, token);
            parentId = folder.id;
        }
        return parentId;
    }

    async function pollCopyMonitor(monitorUrl) {
        if (!monitorUrl) return;
        for (let attempt = 0; attempt < 30; attempt++) {
            const resp = await fetch(monitorUrl);
            const data = await resp.json();
            if (data.status === "completed") return;
            if (data.status === "failed") throw new Error(`Template copy failed: ${data.statusDescription || JSON.stringify(data)}`);
            await sleep(2000);
        }
        throw new Error("Template copy is taking longer than expected — check the destination folder manually.");
    }

    async function copyTemplateFolder(destParentId, newName, token) {
        const templateItem = await graphGetOrNull(
            `https://graph.microsoft.com/v1.0/drives/${ARCHIVE_DRIVE_ID}/root:/${encodePath(TEMPLATE_PATH)}`,
            token
        );
        if (!templateItem) throw new Error("Could not find the SUPER00000_Project_Template folder.");

        const response = await fetch(
            `https://graph.microsoft.com/v1.0/drives/${ARCHIVE_DRIVE_ID}/items/${templateItem.id}/copy`,
            {
                method: "POST",
                headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ parentReference: { driveId: ARCHIVE_DRIVE_ID, id: destParentId }, name: newName })
            }
        );
        if (response.status !== 202) {
            const errorText = await response.text();
            throw new Error(`Failed to start template copy: ${response.status} - ${errorText}`);
        }
        await pollCopyMonitor(response.headers.get("Location"));

        const newItem = await graphGetOrNull(
            `https://graph.microsoft.com/v1.0/drives/${ARCHIVE_DRIVE_ID}/root:/${encodePath(npState.archivePath)}/${encodeURIComponent(newName)}`,
            token
        );
        if (!newItem) throw new Error("Template copy reported success, but the new folder could not be found.");
        return newItem;
    }

    function getAttachmentContent(attachmentId) {
        return new Promise((resolve, reject) => {
            Office.context.mailbox.item.getAttachmentContentAsync(attachmentId, (result) => {
                if (result.status === Office.AsyncResultStatus.Succeeded) resolve(result.value);
                else reject(new Error(result.error ? result.error.message : "Failed to read attachment"));
            });
        });
    }

    async function uploadFileContent(driveId, parentId, filename, bytes, contentType, token) {
        if (bytes.byteLength > 4 * 1024 * 1024) {
            throw new Error(`"${filename}" is larger than 4MB — large-file upload isn't supported yet in this version.`);
        }
        const response = await fetch(
            `https://graph.microsoft.com/v1.0/drives/${driveId}/items/${parentId}:/${encodeURIComponent(filename)}:/content`,
            { method: "PUT", headers: { Authorization: `Bearer ${token}`, "Content-Type": contentType }, body: bytes }
        );
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Upload failed: ${response.status} - ${errorText}`);
        }
        return response.json();
    }

    async function fetchEmailAsEml(internetMessageId, mailToken) {
        const findUrl = `https://graph.microsoft.com/v1.0/me/messages?$filter=internetMessageId eq '${encodeURIComponent(internetMessageId)}'&$select=id`;
        const findData = await graphGetOrNull(findUrl, mailToken);
        if (!findData || !findData.value || findData.value.length === 0) return null;

        const response = await fetch(`https://graph.microsoft.com/v1.0/me/messages/${findData.value[0].id}/$value`, {
            headers: { Authorization: `Bearer ${mailToken}` }
        });
        if (!response.ok) throw new Error(`Could not download email content: ${response.status}`);
        return response.arrayBuffer();
    }

    async function fileEmailAndAttachments(driveId, bdFolderId, token) {
        const results = { email: null, attachments: [], errors: [] };
        const item = getCurrentMailItem();
        if (!item) return results;

        try {
            if (item.internetMessageId) {
                const mailToken = await signInAndGetToken(graphRequest, true);
                const emlBytes = await fetchEmailAsEml(item.internetMessageId, mailToken);
                if (emlBytes) {
                    const filename = sanitizeFileName(`${item.subject || "email"}.eml`);
                    await uploadFileContent(driveId, bdFolderId, filename, new Uint8Array(emlBytes), "message/rfc822", token);
                    results.email = filename;
                }
            }
        } catch (err) {
            results.errors.push(`Email: ${err.message}`);
        }

        const attachments = (item.attachments || []).filter(a => !a.isInline);
        for (const attachment of attachments) {
            try {
                const content = await getAttachmentContent(attachment.id);
                const filename = sanitizeFileName(attachment.name);
                await uploadFileContent(driveId, bdFolderId, filename, base64ToBytes(content.content), "application/octet-stream", token);
                results.attachments.push(filename);
            } catch (err) {
                results.errors.push(`Attachment "${attachment.name}": ${err.message}`);
            }
        }

        return results;
    }

    async function handleConfirmCreate() {
        const confirmStatus = document.getElementById("npConfirmStatus");
        const confirmButton = document.getElementById("npConfirmButton");
        confirmStatus.style.color = "#333";
        confirmStatus.textContent = "Creating project folder...";
        confirmButton.disabled = true;

        try {
            const token = npState.token;

            // Race-condition mitigation: recheck immediately before writing (see brief §5).
            const recheck = await getNextProjectNumber(token, npState.combo);
            if (recheck.nextNNN !== npState.nnn) {
                throw new Error("Someone else just took that project number. Please go back and try again.");
            }

            const branchFolderId = await getOrCreateBranchFolder(ARCHIVE_DRIVE_ID, npState.archivePath, token);

            const existing = await graphGetOrNull(
                `https://graph.microsoft.com/v1.0/drives/${ARCHIVE_DRIVE_ID}/root:/${encodePath(npState.archivePath)}/${encodeURIComponent(npState.folderName)}`,
                token
            );
            if (existing) {
                throw new Error(`A folder named "${npState.folderName}" already exists. Refusing to overwrite — please go back and retry.`);
            }

            let bdFolderId, projectFolderWebUrl;
            if (npState.service === "Sustainability") {
                confirmStatus.textContent = "Copying project template...";
                const newFolder = await copyTemplateFolder(branchFolderId, npState.folderName, token);
                projectFolderWebUrl = newFolder.webUrl;
                const bdFolder = await graphGetOrNull(
                    `https://graph.microsoft.com/v1.0/drives/${ARCHIVE_DRIVE_ID}/items/${newFolder.id}:/Admin/BD`,
                    token
                );
                if (!bdFolder) throw new Error("Template was copied, but its Admin/BD folder could not be found — please check the folder manually.");
                bdFolderId = bdFolder.id;
            } else {
                confirmStatus.textContent = "Creating blank project folder...";
                const projectFolder = await createFolder(ARCHIVE_DRIVE_ID, branchFolderId, npState.folderName, token);
                projectFolderWebUrl = projectFolder.webUrl;
                const bdFolder = await createFolder(ARCHIVE_DRIVE_ID, projectFolder.id, "BD", token);
                bdFolderId = bdFolder.id;
            }

            confirmStatus.textContent = "Filing email and attachments...";
            const filingResults = await fileEmailAndAttachments(ARCHIVE_DRIVE_ID, bdFolderId, token);

            renderResultStep({ folderName: npState.folderName, webUrl: projectFolderWebUrl, filingResults }, null);
            showWizardStep("result");
        } catch (err) {
            console.error("Failed to create project folder:", err);
            renderResultStep(null, err.message);
            showWizardStep("result");
        } finally {
            confirmButton.disabled = false;
        }
    }

            .filter(entry => entry.combo.startsWith(servicePrefix))

    async function copyFolderAcrossDrives(sourceDriveId, sourceItemId, destDriveId, destParentId, newName, token) {
        const response = await fetch(
            `https://graph.microsoft.com/v1.0/drives/${sourceDriveId}/items/${sourceItemId}/copy`,
            {
                method: "POST",
                headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ parentReference: { driveId: destDriveId, id: destParentId }, name: newName })
            }
        );
        if (response.status !== 202) {
            const errorText = await response.text();
            throw new Error(`Failed to start copy: ${response.status} - ${errorText}`);
        }
        await pollCopyMonitor(response.headers.get("Location"));
    }

    async function deleteItem(driveId, itemId, token) {
        const response = await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${token}` }
        });
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`${response.status} - ${errorText}`);
        }
    }

    async function handleConvertConfirm() {
        const { selectedEntry, destPath, token } = cvState;
        const confirmStatus = document.getElementById("cvConfirmStatus");
        const confirmButton = document.getElementById("cvConfirmButton");
        confirmStatus.style.color = "#333";
        confirmButton.disabled = true;

        try {
            // Race-condition mitigation: recheck immediately before writing.
            const destExisting = await graphGetOrNull(
                `https://graph.microsoft.com/v1.0/drives/${ACTIVE_DRIVE_ID}/root:/${encodePath(destPath)}/${encodeURIComponent(selectedEntry.name)}`,
                token
            );
            if (destExisting) {
                throw new Error(`A folder named "${selectedEntry.name}" already exists in Active. Refusing to convert.`);
            }

            const sourceItem = await graphGetOrNull(
                `https://graph.microsoft.com/v1.0/drives/${ARCHIVE_DRIVE_ID}/root:/${encodePath(selectedEntry.archivePath)}/${encodeURIComponent(selectedEntry.name)}`,
                token
            );
            if (!sourceItem) {

            confirmStatus.textContent = "Preparing Active branch folder...";

            confirmButton.disabled = false;

            if (!token) throw new Error("Could not get permission to list shared mailboxes.");

            sharedMailboxSearchEntries = await getSharedMailboxes(token);
            renderSharedMailboxSearchList(document.getElementById("smFilterBox").value);
            status.textContent = "";
        } catch (err) {
            console.error("Failed to load shared mailboxes:", err);
            status.textContent = `Error: ${err.message}`;
            status.style.color = "red";
        }
    }

    function renderSharedMailboxSearchList(filter) {
        const list = document.getElementById("smMailboxList");
        list.innerHTML = "";
        const selectedService = document.querySelector('input[name="smService"]:checked').value;
        const servicePrefix = selectedService === "Energy" ? "EN" : "SU";
        const normalizedFilter = (filter || "").toLowerCase();
        const filtered = sharedMailboxSearchEntries
            .filter(entry => entry.path[0].toUpperCase().startsWith(servicePrefix))
            .filter(entry => entry.path[0].toLowerCase().includes(normalizedFilter));

        if (filtered.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty-message";
            empty.textContent = "No matching shared mailboxes found.";
            list.appendChild(empty);
            return;
        }

        filtered.forEach(entry => {
            const item = document.createElement("div");
            item.className = "folder-item";

            const name = document.createElement("span");
            name.className = "name";
            name.textContent = entry.path[0];
            item.appendChild(name);

            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = "Open in OWA";
            item.appendChild(tag);

            item.title = entry.mail;
            item.addEventListener("click", () => openMailboxInBrowser(entry.mail));

            list.appendChild(item);
        });
    }

    // Classic Outlook desktop/Mac support Office.context.ui.openBrowserWindow, which breaks
    // out of the add-in's sandboxed webview into the OS default browser. New Outlook and
    // Outlook on the web don't support it at all, so fall back to a plain window.open there.
    function openMailboxInBrowser(mail) {
        const status = document.getElementById("smStatus");
        const url = `https://outlook.office.com/mail/${encodeURIComponent(mail)}/`;
        try {
            const supportsOpenBrowserWindow = typeof Office !== "undefined" && Office.context &&
                Office.context.requirements && Office.context.requirements.isSetSupported("OpenBrowserWindowApi", "1.1");
            if (supportsOpenBrowserWindow) {
                Office.context.ui.openBrowserWindow(url);
            } else {
                window.open(url, "_blank", "noopener");
            }
            status.style.color = "#333";
            status.textContent = `Opening ${mail} in Outlook Web...`;
        } catch (err) {
            console.error("Failed to open mailbox in browser:", err);
            status.style.color = "red";
            status.textContent = `Could not open ${mail}: ${err.message}`;
        }
    }
  </script>
  <script>
    // Additive only — labels the header with the account MSAL already holds.
    (function () {
      function shortName(account) {
        var n = (account && (account.name || account.username)) || "";
        if (!n) return "";
        if (n.indexOf("@") > -1 && n.indexOf(" ") === -1) return n.split("@")[0];
        var parts = n.trim().split(/\s+/);
        return parts.length > 1 ? parts[0].charAt(0) + ". " + parts[parts.length - 1] : n;
      }
      var tries = 0;
      var timer = setInterval(function () {
        tries++;
        try {
          if (typeof msalInstance !== "undefined" && msalInstance) {
            var acc = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0];
            var label = shortName(acc);
            if (label) {
              document.getElementById("brandUserName").textContent = label;
              clearInterval(timer);
              return;
            }
          }
        } catch (e) { /* cosmetic only — never block the app */ }
        if (tries > 60) clearInterval(timer);
      }, 1000);
    })();
  </script>
</body>
