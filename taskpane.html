<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Summation Assistant</title>
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; padding-bottom: 25px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header .branding { font-size: 24px; font-weight: bold; color: #408F4E; }
    .header img { height: 40px; }
    label, input, button { display: block; margin-top: 10px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
    button { padding: 8px; background-color: #408F4E; color: white; border: none; cursor: pointer; }
    #signInPrompt button { width: 50%; margin: 20px auto; }
    #statusMessage { margin-top: 10px; font-style: italic; color: #333; white-space: pre-wrap; }
    #versionDisplay { position: absolute; bottom: 10px; right: 20px; font-size: 10px; color: #888; }
    #refreshButton { position: absolute; bottom: 5px; left: 20px; background: none; border: none; font-size: 16px; color: #888; cursor: pointer; }
    #refreshButton:hover { color: #000; }

    #folderList { border: 1px solid #ccc; border-radius: 4px; max-height: 350px; overflow-y: auto; margin-top: 5px; }
    .folder-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 13px; }
    .folder-item:last-child { border-bottom: none; }
    .folder-item:hover { background-color: #f2f7f2; }
    .folder-item.selected { background-color: #dcecdd; }
    .folder-item .tag { font-size: 10px; color: #888; margin-left: 8px; white-space: nowrap; }
    .folder-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty-message { padding: 10px; color: #888; font-style: italic; font-size: 13px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="branding">Summation Assistant</div>
    <img src="https://prassummation.github.io/outlook-addin/logo-symbol-32x32.png" alt="Company Logo" />
  </div>

  <div id="signInPrompt">
    <p style="text-align: center;">Please sign in to load project folders.</p>
    <button id="signInButton">Sign In</button>
  </div>

  <div id="appBody" style="display: none;">
    <label for="filterBox">Filter Projects / Folders:</label>
    <input type="text" id="filterBox" placeholder="Type to filter..." />
    <div id="folderList"></div>
    <div id="statusMessage"></div>
  </div>

  <button id="refreshButton" title="Refresh Add-in">&#x21bb;</button>
  <div id="versionDisplay"></div>

  <script>
    const APP_VERSION = "8.0";

    let msalInstance;
    let folderEntries = [];

    const msalConfig = {
      auth: {
        clientId: "80497ed0-ecd5-475e-97e0-5c9e90fb8a0d",
        authority: "https://login.microsoftonline.com/ecb5f458-9548-4e8b-96f3-904f1828f931",
        redirectUri: window.location.origin + window.location.pathname
      }
    };

    // Scopes for Microsoft Graph
    const graphRequest = {
        scopes: ["User.Read", "Mail.Read", "Directory.Read.All"]
    };

    Office.onReady(appInit);

    function appInit() {
        document.getElementById("versionDisplay").innerText = `Version: ${APP_VERSION}`;
        document.getElementById("refreshButton").addEventListener("click", () => { window.location.reload(true); });
        document.getElementById("signInButton").addEventListener("click", handleLogin);
        document.getElementById("filterBox").addEventListener("input", () => renderFolderList(document.getElementById("filterBox").value));

        if (typeof msal !== 'undefined' && msal.PublicClientApplication) {
            msalInstance = new msal.PublicClientApplication(msalConfig);
            attemptSilentSignIn();
        } else {
            document.getElementById("signInPrompt").innerHTML = "<p>Error: Could not load authentication library.</p>";
        }
    }

    function showAppUi(show) {
        document.getElementById("appBody").style.display = show ? "block" : "none";
        document.getElementById("signInPrompt").style.display = show ? "none" : "block";
    }

    async function handleLogin() {
        updateStatus("Please sign in using the pop-up window...");
        try {
            const loginResponse = await msalInstance.loginPopup(graphRequest);
            msalInstance.setActiveAccount(loginResponse.account);

            showAppUi(true);
            setTimeout(() => document.getElementById("filterBox").focus(), 100);
            await loadFolders();
        } catch (error) {
            console.error("Interactive sign in failed:", error);
            updateStatus("Sign in failed. Please try again.", true);
            showAppUi(false);
        }
    }

    async function attemptSilentSignIn() {
        try {
            const token = await signInAndGetToken(false);
            if (token) {
                showAppUi(true);
                setTimeout(() => document.getElementById("filterBox").focus(), 100);
                await loadFolders();
            } else {
                showAppUi(false);
            }
        } catch (error) {
            console.log("Silent sign-in failed, user interaction required.", error);
            showAppUi(false);
        }
    }

    function updateStatus(message, isError = false) {
        document.getElementById("statusMessage").innerText = message;
        document.getElementById("statusMessage").style.color = isError ? "red" : "#333";
    }

    async function signInAndGetToken(isUserAction = false) {
        const account = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0];
        if (account) {
            try {
                const silentResponse = await msalInstance.acquireTokenSilent({ ...graphRequest, account });
                return silentResponse.accessToken;
            } catch (error) {
                if (error instanceof msal.InteractionRequiredAuthError && isUserAction) {
                    const interactiveResponse = await msalInstance.acquireTokenPopup(graphRequest);
                    return interactiveResponse.accessToken;
                }
                throw error;
            }
        }
        if (isUserAction) {
            const loginResponse = await msalInstance.loginPopup(graphRequest);
            msalInstance.setActiveAccount(loginResponse.account);
            return loginResponse.accessToken;
        }
        return null;
    }

    async function graphGet(url, token) {
        const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Graph API error: ${response.status} ${response.statusText} - ${errorText}`);
        }
        return response.json();
    }

    async function loadFolders() {
        updateStatus("Loading project folders...");
        try {
            const token = await signInAndGetToken(false);
            if (!token) {
                updateStatus("Authentication token is missing. Please sign in again.", true);
                showAppUi(false);
                return;
            }

            const [ownFolders, sharedMailboxes] = await Promise.all([
                getAllInboxSubfolders(token),
                getSharedMailboxes(token)
            ]);

            folderEntries = [...ownFolders, ...sharedMailboxes];
            renderFolderList(document.getElementById("filterBox").value);
            updateStatus("");
        } catch (err) {
            console.error("Failed to load folders", err);
            updateStatus("Failed to load project folders. Please click Sign In.", true);
            showAppUi(false);
        }
    }

    // All subfolders (any depth) under the signed-in user's own Inbox.
    async function getAllInboxSubfolders(token) {
        const inbox = await graphGet(
            "https://graph.microsoft.com/v1.0/me/mailFolders/inbox?$select=id,displayName",
            token
        );
        return fetchChildFolders(inbox.id, [], token, "own");
    }

    async function fetchChildFolders(folderId, parentPath, token, type) {
        const children = [];
        let url = `https://graph.microsoft.com/v1.0/me/mailFolders/${folderId}/childFolders?$select=id,displayName,childFolderCount&$top=100`;
        while (url) {
            const data = await graphGet(url, token);
            children.push(...data.value);
            url = data["@odata.nextLink"] || null;
        }
        children.sort((a, b) => a.displayName.localeCompare(b.displayName));

        const results = [];
        for (const folder of children) {
            const path = [...parentPath, folder.displayName];
            results.push({ path, depth: path.length - 1, type });
            if (folder.childFolderCount > 0) {
                const nested = await fetchChildFolders(folder.id, path, token, type);
                results.push(...nested);
            }
        }
        return results;
    }

    // Shared/project mailboxes are represented by a single entry for their Inbox.
    async function getSharedMailboxes(token) {
        const url = "https://graph.microsoft.com/v1.0/users?$select=displayName,mail,userPrincipalName,assignedLicenses&$top=999";
        const data = await graphGet(url, token);
        const projectMailboxRegex = /^[a-zA-Z]{5}\d{5}_.*@summation\.au$/i;
        const sharedMailboxes = data.value.filter(user =>
            user.assignedLicenses.length === 0 && user.mail && projectMailboxRegex.test(user.mail)
        );
        return sharedMailboxes
            .map(user => ({ path: [user.mail.split("@")[0], "Inbox"], depth: 0, type: "shared", mail: user.mail }))
            .sort((a, b) => a.path[0].localeCompare(b.path[0]));
    }

    function renderFolderList(filter) {
        const folderList = document.getElementById("folderList");
        folderList.innerHTML = "";
        const normalizedFilter = (filter || "").toLowerCase();
        const filtered = folderEntries.filter(entry =>
            entry.path.join(" / ").toLowerCase().includes(normalizedFilter)
        );

        if (filtered.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty-message";
            empty.textContent = "No matching folders found.";
            folderList.appendChild(empty);
            return;
        }

        filtered.forEach(entry => {
            const item = document.createElement("div");
            item.className = "folder-item";
            item.style.paddingLeft = `${10 + entry.depth * 16}px`;

            const name = document.createElement("span");
            name.className = "name";
            name.textContent = entry.path[entry.path.length - 1];
            item.appendChild(name);

            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = entry.type === "shared" ? entry.path[0] : "My Inbox";
            item.appendChild(tag);

            item.title = entry.path.join(" / ");
            item.addEventListener("click", () => {
                document.querySelectorAll(".folder-item.selected").forEach(el => el.classList.remove("selected"));
                item.classList.add("selected");
            });

            folderList.appendChild(item);
        });
    }
  </script>
</body>
</html>
