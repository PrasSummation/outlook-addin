<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>File on Send</title>
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
  <style>
    :root{
      --green:#408F4E; --green-dark:#2D6B38; --green-pale:#EDF7EE;
      --grey-900:#2B2B2B; --grey-600:#646464; --grey-400:#909090;
      --grey-500:#787878; --grey-300:#B4B4B4; --grey-200:#DCDCDC; --grey-100:#EFEFEF; --grey-50:#F7F7F7;
      --reply-only:#3B4A5A; --reply-only-dark:#2E3A47;
      --font-display:'Bahnschrift','DIN Alternate','Segoe UI',sans-serif;
      --font-body:'Calibri','Segoe UI',system-ui,sans-serif;
      --font-mono:'Consolas','Courier New',monospace;
    }
    *{box-sizing:border-box}
    body{margin:0;padding:0;background:#fff;font-family:var(--font-body);
         font-size:13px;line-height:1.5;color:var(--grey-600);-webkit-font-smoothing:antialiased}
    a{color:var(--green-dark);text-decoration:none}
    a:hover{color:var(--green);text-decoration:underline}

    #brandBar{background:var(--grey-900);padding:14px 20px;display:flex;align-items:center;gap:10px}
    #brandBar img{width:26px;height:26px}
    #brandBar .word{font-family:var(--font-display);font-size:14px;font-weight:600;color:#fff;letter-spacing:.14em}
    #brandBar .sub{font-size:10.5px;color:var(--grey-400);letter-spacing:.05em}

    #cancelRow{padding:9px 20px;border-bottom:1px solid var(--grey-100);
      display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--grey-50)}
    #cancelRow .txt{font-size:11px;color:var(--grey-400)}
    #cancelLink{appearance:none;border:none;background:none;color:#B3401F;font:600 11.5px/1.2 var(--font-body);
      cursor:pointer;padding:4px 6px;border-radius:4px}
    #cancelLink:hover{background:#FBEAE4;text-decoration:underline}

    #signInPrompt{padding:60px 24px;text-align:center}
    #signInPrompt p{margin:0 0 20px;font-size:13px;color:var(--grey-600)}
    #signInButton{padding:10px 24px;font:600 13px var(--font-body);color:#fff;background:var(--green);
      border:1px solid var(--green);border-radius:4px;cursor:pointer}
    #signInButton:hover{background:var(--green-dark)}

    #appBody{max-width:520px;margin:0 auto;padding:16px 22px 22px}

    label{display:block;width:100%;margin:12px 0 6px;font-size:10px;letter-spacing:.09em;
      text-transform:uppercase;color:var(--grey-400)}
    label:first-of-type{margin-top:0}
    input[type=text]{display:block;width:100%;margin:0 0 10px;padding:8px 10px;
      font:400 13px/1.4 var(--font-body);color:var(--grey-900);background:#fff;
      border:1.5px solid var(--grey-200);border-radius:4px}
    input[type=text]:focus{outline:none;border-color:var(--green)}
    button{display:block;width:100%;margin:0 0 9px;padding:11px 12px;
      font:600 13px/1.2 var(--font-body);letter-spacing:.02em;color:#fff;
      background:var(--green);border:1px solid var(--green);border-radius:6px;cursor:pointer}
    button:hover{background:var(--green-dark);border-color:var(--green-dark)}
    button:disabled{background:var(--grey-100);border-color:var(--grey-200);color:var(--grey-500);cursor:not-allowed}
    button .hint{display:block;font-weight:400;font-size:10.5px;color:#DDF0E0;margin-top:2px}
    button.secondary-action{background:var(--reply-only);border-color:var(--reply-only)}
    button.secondary-action:hover{background:var(--reply-only-dark);border-color:var(--reply-only-dark)}
    button.secondary-action .hint{color:#C7CFD6}
    .link-button{appearance:none;border:none;background:none;color:var(--grey-600);
      font:600 11.5px/1.2 var(--font-body);cursor:pointer;padding:6px 2px;text-align:left;width:auto;display:inline-block}
    .link-button:hover{color:var(--grey-900);text-decoration:underline}

    .radio-row{display:flex;gap:16px;margin-bottom:10px}
    .radio-row label{display:flex;align-items:center;gap:6px;width:auto;margin:0;
      font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--grey-900)}
    .radio-row input{display:inline-block;width:auto;margin:0;accent-color:var(--green)}

    .list-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:12px 0 6px}
    .list-head label{margin:0}
    #refreshListButton{flex:none;width:24px;height:24px;margin:0;padding:0;border-radius:6px;
      border:1px solid var(--grey-200);background:#fff;color:var(--grey-600);font-size:13px;
      display:flex;align-items:center;justify-content:center;transition:transform 400ms ease}
    #refreshListButton:hover{background:#fff;border-color:var(--grey-400);color:var(--grey-900)}
    #refreshListButton.spinning{transform:rotate(300deg)}

    #folderList{max-height:260px;overflow-y:auto;border:1px solid var(--grey-200);border-radius:8px;margin-top:0}
    .folder-item{display:flex;justify-content:space-between;align-items:center;gap:10px;
      padding:9px 11px;border-bottom:1px solid var(--grey-100);cursor:pointer;font-size:12.5px;outline:none}
    .folder-item:last-child{border-bottom:none}
    .folder-item:hover{background:var(--grey-50)}
    .folder-item:focus{background:var(--grey-50);box-shadow:inset 0 0 0 2px var(--green)}
    .folder-item.selected{background:var(--green-pale);box-shadow:inset 2px 0 0 var(--green)}
    .folder-item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--grey-900)}
    .folder-item .tag{flex:none;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.03em;color:var(--grey-400)}
    .folder-item.suggested .name{color:var(--green-dark);font-weight:600}
    .folder-item.suggested .tag{font-family:var(--font-body);color:var(--green-dark);text-transform:none;letter-spacing:0}
    .empty-message{padding:12px;color:var(--grey-400);font-size:12px}
    #listStatus{font-size:10.5px;color:var(--grey-400);margin-top:6px}
    #skipSaveButton{display:block;margin-top:14px;text-align:center;width:100%}

    .context{border:1px solid var(--grey-200);border-radius:8px;padding:10px 11px;margin-bottom:14px;background:var(--grey-50)}
    .context .row{margin-bottom:4px;font-size:12px;color:var(--grey-600)}
    .context .row:last-child{margin-bottom:0}
    .context .row b{color:var(--grey-900);font-weight:600}
    .context .subject{color:var(--grey-900);font-weight:600;font-size:12.5px;margin-bottom:5px}

    .summary-box{border:1px solid var(--grey-200);border-radius:8px;padding:14px;font-size:12.5px;background:var(--grey-50)}
    .warning-box{border:1px solid #E78707;background:#FFF8E1;color:#7A5B00;border-radius:4px;padding:10px;font-size:12px;margin-bottom:10px}

    .step{display:none}
    .step.active{display:block}
  </style>
</head>
<body>
  <div id="brandBar">
    <img src="https://prassummation.github.io/outlook-addin/logo-symbol-32x32.png" alt="Summation" />
    <div>
      <div class="word">SUMMATION</div>
      <div class="sub">File this email</div>
    </div>
  </div>

  <div id="cancelRow">
    <!-- "Sending will pause..." was accurate only for the OnMessageSend-triggered path, which
         is currently always off (FILE_ON_SEND_ENABLED = false, commands.js) -- today this dialog
         only ever opens from the proactive compose-time banner, which never blocks or resumes a
         send at all (the user still sends manually afterward). Updated 2026-10-21 to stop
         implying otherwise; if File on Send is ever re-enabled, this needs to go back to being
         conditional on which path opened the dialog (sendContext has no such flag yet). -->
    <span class="txt">Choose a project to tag this email -- send it yourself when ready.</span>
    <button id="cancelLink" class="link-button" style="color:#B3401F">&larr; Back to email</button>
  </div>

  <div id="signInPrompt">
    <p>Please sign in to file this email.</p>
    <button id="signInButton">Sign In</button>
  </div>

  <div id="appBody" style="display:none;">
    <!-- Step: pick a project -->
    <div class="step active" id="stepPick">
      <div class="context">
        <div class="subject" id="pickSubject"></div>
        <div class="row" id="pickContextLine"></div>
      </div>

      <label>Service</label>
      <div class="radio-row">
        <label><input type="radio" name="fosService" value="All" checked /> All</label>
        <label><input type="radio" name="fosService" value="Sustainability" /> Sustainability</label>
        <label><input type="radio" name="fosService" value="Energy" /> Energy</label>
      </div>

      <div class="list-head">
        <label for="fosFilterBox" style="margin:0">Search Archive &amp; Active project folders</label>
        <button type="button" id="refreshListButton" title="Refresh project list">&#8635;</button>
      </div>
      <input type="text" id="fosFilterBox" placeholder="Type to search, &darr; to browse the list..." />
      <div id="folderList"></div>
      <div id="listStatus"></div>
      <button type="button" id="skipSaveButton" class="link-button">Skip &mdash; send without filing</button>
    </div>

    <!-- Step: confirm + choose what to save -->
    <div class="step" id="stepConfirm">
      <div class="context">
        <div class="row"><b>Project</b></div>
        <div class="row" id="confirmProject" style="font-size:13px;color:var(--grey-900);font-weight:600"></div>
      </div>
      <div class="context" id="confirmOriginalContext" style="display:none;">
        <div class="row" id="confirmOriginalLine"></div>
        <div class="row">&#8629; <b>Reply</b> &mdash; your message, not yet sent</div>
      </div>

      <button id="saveBothButton">
        Categorise Both
        <span class="hint">Categorises the original email and this reply</span>
      </button>
      <button id="categoriseConversationButton" class="secondary-action">
        Categorise Conversation
        <span class="hint">Categorises every message in this conversation</span>
      </button>
      <button id="saveReplyOnlyButton" class="secondary-action">
        <span id="saveReplyOnlyLabel">Categorise Reply Only</span>
        <span class="hint" id="saveReplyOnlyHint">Categorises just this reply</span>
      </button>
      <button id="backToPickButton" class="link-button">&larr; Choose a different project</button>
    </div>

    <!-- Step: send cancelled -->
    <div class="step" id="stepCancelled">
      <div class="warning-box">
        <b>Send cancelled.</b> You're back in the draft &mdash; nothing was sent or filed.
      </div>
    </div>
  </div>

  <script>
    // File on Send's real picker -- the go-live build of the approved mockup
    // (https://claude.ai/artifact/EqTMRsGos3VHXtspmZPXpp). Opened by commands.js's
    // onMessageSendHandler via Office.context.ui.displayDialogAsync when a message is
    // sent (manifest's OnMessageSend LaunchEvent, SendMode="SoftBlock").
    //
    // Division of labor (same split as file-email-dialog.html, for the same reason --
    // dialogs get no Office.context.mailbox at all, only Office.context.ui.* messaging):
    //   - commands.js (the parent) detects compose context (subject, compose type,
    //     conversationId) before opening this, and is the ONLY side that can tag the
    //     outgoing item's categories or allow/cancel the send -- both need
    //     Office.context.mailbox, which this dialog never gets.
    //   - This dialog does everything requiring network/auth: the project list (same
    //     Graph/SharePoint folder listing as File Email), and -- for "Categorise Both"/
    //     "Categorise Conversation" on a reply/forward -- finding the relevant message(s)
    //     via a conversationId search, since there's no direct API for "the item I'm
    //     replying to" from a compose item.
    //
    // REVISED 2026-10-25: this dialog only ever CATEGORISES now -- it never moves anything.
    // It used to also move the original into "Emails to File" immediately, which dragged an
    // open, in-progress reply/forward draft along with it (confirmed live: relocating the
    // original while a draft still referenced it visibly disturbed the draft). Categorising
    // in place has no such side effect. The user moves a categorised original into "Emails to
    // File" themselves whenever they're ready -- the same manual staging step File Email's own
    // batch flow already relies on -- and SyncEmails's existing staging-folder pass files and
    // relocates it from there exactly as it does for any other staged email. "Categorise
    // Conversation" extends the same idea to every message in the thread, not just one.
    //
    // On Categorise Both/Conversation/Reply Only/Categorise: messages the parent with the
    // chosen category so it can tag the outgoing item, fires (and does NOT wait for) the
    // bridge call to categorise the original/conversation if asked, and closes almost
    // immediately -- same reasoning as File Email's Confirm: the bridge keeps the request
    // running to completion server-side regardless, and the outcome surfaces later via the
    // shared pending-batches notice (File Email's dialog reads the same localStorage key this
    // writes to).
    //
    // On Cancel/X: messages the parent to cancel the send (event.completed({allowEvent:
    // false})), shows "Send cancelled" briefly, then closes itself -- the user is already
    // looking at their draft underneath, so there's nothing further to do here.

    const BRIDGE_URL = "https://summation-exchange-bridge-e6e5gsendkdxdwf5.australiaeast-01.azurewebsites.net";
    const ACTIVE_DRIVE_ID = "b!6LWosCcMRkupf-n3ZowwIVyhngMkW-pOtIqfTmHpQ5wp-OK02_E3RbZkRH_jE_Lr";
    const ARCHIVE_DRIVE_ID = "b!6LWosCcMRkupf-n3ZowwIVyhngMkW-pOtIqfTmHpQ5zGiD4R7k2PQZMwL6mUreXS";
    const ACTIVE_BRANCH_PATH = {
        SUPER: "Sustainability/Perth", SUADL: "Sustainability/Adelaide",
        ENPER: "Energy/Perth", ENADL: "Energy/Adelaide"
    };
    const ARCHIVE_BRANCH_PATH = {
        SUPER: "Sustainability/Perth", SUADL: "Sustainability/Archived_Adelaide",
        ENPER: "Energy/Perth", ENADL: "Energy/Adelaide"
    };

    const msalConfig = {
      auth: {
        clientId: "80497ed0-ecd5-475e-97e0-5c9e90fb8a0d",
        authority: "https://login.microsoftonline.com/ecb5f458-9548-4e8b-96f3-904f1828f931",
        redirectUri: window.location.origin + window.location.pathname
      },
      cache: { cacheLocation: "localStorage", storeAuthStateInCookie: false }
    };

    const graphRequest = { scopes: ["User.Read"] };
    const sitesRequest = { scopes: ["Sites.Selected"] };
    const bridgeRequest = { scopes: ["api://80497ed0-ecd5-475e-97e0-5c9e90fb8a0d/MailboxBridge.Call"] };
    const mailWriteRequest = { scopes: ["Mail.ReadWrite", "MailboxSettings.ReadWrite"] };
    const indexRequest = { scopes: ["api://80497ed0-ecd5-475e-97e0-5c9e90fb8a0d/EmailIndex.Access"] };
    const SUGGEST_API_URL = "https://summation-email-index.azurewebsites.net";

    // Bounded wrapper for a promise that might hang instead of rejecting (e.g. a blocked
    // silent-auth iframe) -- ported from file-email-dialog.html, same reasoning: a
    // suggestions fetch must never be able to hang this dialog open.
    function withTimeout(promise, ms, label) {
        return Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} timed out after ${ms}ms`)), ms))
        ]);
    }

    let msalInstance;

    // ---- Initial context from the URL (whatever commands.js detected at send time) ----
    // { subject, composeType: "newMail"|"reply"|"forward"|"replyAll", conversationId }
    let sendContext = { subject: "(no subject)", composeType: "newMail", conversationId: null };
    (function captureInitialContext() {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get("context");
        if (!raw) return;
        try {
            const parsed = JSON.parse(raw);
            sendContext = Object.assign(sendContext, parsed);
        } catch (err) {
            console.error("Malformed initial context from opener:", err);
        }
    })();

    const isReplyLike = sendContext.composeType === "reply" || sendContext.composeType === "replyAll" || sendContext.composeType === "forward";

    function messageParent(payload) {
        try { Office.context.ui.messageParent(JSON.stringify(payload)); } catch (err) { console.error("Could not message the opener:", err); }
    }

    Office.onReady(() => {
        document.getElementById("pickSubject").textContent = sendContext.subject;
        document.getElementById("pickContextLine").textContent = isReplyLike
            ? "Replying/forwarding -- you can categorise the original message too."
            : "New message -- categorised once it's sent.";
        document.getElementById("saveReplyOnlyButton").style.display = isReplyLike ? "block" : "none";
        document.getElementById("categoriseConversationButton").style.display = isReplyLike ? "block" : "none";
        if (!isReplyLike) {
            // No "original" to additionally categorise for a fresh compose -- one plain action.
            document.getElementById("saveBothButton").textContent = "";
            const label = document.createElement("span");
            label.textContent = "Categorise";
            const hint = document.createElement("span");
            hint.className = "hint";
            hint.textContent = "Categorises this email once it's sent";
            document.getElementById("saveBothButton").appendChild(label);
            document.getElementById("saveBothButton").appendChild(hint);
        }

        document.getElementById("signInButton").addEventListener("click", handleLogin);
        document.getElementById("fosFilterBox").addEventListener("input", () => renderFolderList(document.getElementById("fosFilterBox").value));
        document.getElementById("fosFilterBox").addEventListener("keydown", handleFilterKeydown);
        document.querySelectorAll('input[name="fosService"]').forEach(el =>
            el.addEventListener("change", () => renderFolderList(document.getElementById("fosFilterBox").value))
        );
        document.getElementById("refreshListButton").addEventListener("click", refreshFolderList);
        document.getElementById("backToPickButton").addEventListener("click", () => showStep("stepPick"));
        document.getElementById("saveBothButton").addEventListener("click", () => handleSave(true));
        document.getElementById("saveReplyOnlyButton").addEventListener("click", () => handleSave(false));
        document.getElementById("categoriseConversationButton").addEventListener("click", () => handleSaveConversation());
        document.getElementById("saveBothButton").addEventListener("keydown", handleConfirmButtonKeydown);
        document.getElementById("saveReplyOnlyButton").addEventListener("keydown", handleConfirmButtonKeydown);
        document.getElementById("categoriseConversationButton").addEventListener("keydown", handleConfirmButtonKeydown);
        document.getElementById("cancelLink").addEventListener("click", handleCancel);
        document.getElementById("skipSaveButton").addEventListener("click", handleSkip);

        msalInstance = new msal.PublicClientApplication(msalConfig);
        attemptSilentSignIn();
    });

    function showApp(show) {
        document.getElementById("appBody").style.display = show ? "block" : "none";
        document.getElementById("signInPrompt").style.display = show ? "none" : "block";
        // Tells commands.js's bounded ready-timeout to stand down -- this is the first
        // point where something real has actually rendered (sign-in prompt or the
        // picker), so whatever happens from here is a user taking their time, not a
        // hung dialog.
        messageParent({ action: "ready" });
    }

    async function signInAndGetToken(request, isUserAction) {
        const account = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0];
        if (account) {
            try {
                const silentResponse = await msalInstance.acquireTokenSilent({ ...request, account });
                return silentResponse.accessToken;
            } catch (error) {
                if (error instanceof msal.InteractionRequiredAuthError && isUserAction) {
                    const interactiveResponse = await msalInstance.acquireTokenPopup(request);
                    return interactiveResponse.accessToken;
                }
                throw error;
            }
        }
        if (isUserAction) {
            const loginResponse = await msalInstance.loginPopup(request);
            msalInstance.setActiveAccount(loginResponse.account);
            return loginResponse.accessToken;
        }
        return null;
    }

    // Acquires two different-scope tokens concurrently when possible, added 2026-10-24 to cut
    // save-on-send latency (postFeBatch needed mailWriteRequest then bridgeRequest, one after the
    // other, even though they're unrelated resources). Silent acquisition for both is tried in
    // parallel -- the common case, since both are normally already cached from earlier in the
    // dialog's lifecycle -- but falls back to serial interactive popups for whichever one needs it,
    // since MSAL throws "interaction_in_progress" if two acquireTokenPopup calls overlap.
    async function signInAndGetTwoTokens(requestA, requestB, isUserAction) {
        const account = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0];
        async function trySilent(request) {
            if (!account) return undefined;
            try { return (await msalInstance.acquireTokenSilent({ ...request, account })).accessToken; }
            catch (error) {
                if (error instanceof msal.InteractionRequiredAuthError) return undefined;
                throw error;
            }
        }
        let [tokenA, tokenB] = await Promise.all([trySilent(requestA), trySilent(requestB)]);
        if (tokenA === undefined) tokenA = await signInAndGetToken(requestA, isUserAction);
        if (tokenB === undefined) tokenB = await signInAndGetToken(requestB, isUserAction);
        return [tokenA, tokenB];
    }

    async function handleLogin() {
        try {
            const loginResponse = await msalInstance.loginPopup(graphRequest);
            msalInstance.setActiveAccount(loginResponse.account);
            showApp(true);
            initFolderList();
            focusSearchBoxOnce();
            fetchSuggestions();
        } catch (err) {
            console.error("Sign in failed:", err);
        }
    }

    async function attemptSilentSignIn() {
        try {
            const token = await signInAndGetToken(graphRequest, false);
            if (token) {
                showApp(true);
                initFolderList();
                focusSearchBoxOnce();
                fetchSuggestions();
            } else {
                showApp(false);
            }
        } catch (err) {
            showApp(false);
        }
    }

    // Dialogs are expected to get real OS focus from the host on creation, but there's no
    // live Outlook test confirming the exact timing -- same retrying helper as
    // file-email-dialog.html's focusWhenReady, ported here since the search box wasn't
    // getting focused on open at all (showStep only focuses it on an explicit transition
    // back to stepPick, never on first load).
    let hasFocusedFilterBox = false;

    function focusSearchBoxOnce() {
        if (hasFocusedFilterBox) return;
        hasFocusedFilterBox = true;
        focusWhenReady("fosFilterBox");
    }

    function focusWhenReady(elementId) {
        const el = document.getElementById(elementId);
        if (!el) return;
        let done = false;

        function tryFocus() {
            if (done || el.offsetParent === null) return;
            try { window.focus(); } catch (err) { /* ignore */ }
            el.focus();
            if (document.activeElement === el) {
                done = true;
                cleanup();
            }
        }
        function cleanup() {
            clearInterval(poll);
            window.removeEventListener("focus", tryFocus);
            document.removeEventListener("visibilitychange", tryFocus);
        }

        const poll = setInterval(tryFocus, 150);
        window.addEventListener("focus", tryFocus);
        document.addEventListener("visibilitychange", tryFocus);
        tryFocus();
        setTimeout(cleanup, 15000);
    }

    // ---- Generic Graph/SharePoint helpers (ported from file-email-dialog.html) ----

    function encodePath(path) {
        return path.split("/").map(encodeURIComponent).join("/");
    }

    async function graphGet(url, token) {
        const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Graph API error: ${response.status} ${response.statusText} - ${errorText}`);
        }
        return response.json();
    }

    async function graphGetOrNull(url, token) {
        const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
        if (response.status === 404) return null;
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Graph API error: ${response.status} ${response.statusText} - ${errorText}`);
        }
        return response.json();
    }

    async function listFolders(driveId, path, token) {
        const data = await graphGetOrNull(
            `https://graph.microsoft.com/v1.0/drives/${driveId}/root:/${encodePath(path)}:/children?$select=name,folder&$top=999`,
            token
        );
        if (!data) return [];
        return (data.value || []).filter(entry => entry.folder);
    }

    function extractProjectNumber(name) {
        const match = /^[a-zA-Z]{5}(\d{5})[_-]/.exec(name || "");
        return match ? parseInt(match[1], 10) : -Infinity;
    }

    function serviceFilterMatches(selectedService, combo) {
        if (selectedService === "All") return true;
        if (selectedService === "Energy") return combo.startsWith("EN");
        if (selectedService === "Sustainability") return combo.startsWith("SU");
        return true;
    }

    function matchesProjectCode(folderName, code) {
        const match = /^([a-zA-Z]{5}\d{5})(?:[_-]|$)/.exec(folderName || "");
        return !!match && !!code && match[1].toUpperCase() === code.toUpperCase();
    }

    // ---- Content-based project suggestions (SPEC_ContentBasedProjectSuggestions.md) ----
    // Originally lighter-weight than File Email's version: this dialog fires at send time,
    // before the outgoing item is a Graph-addressable object, so there's no message to read
    // from/to/cc/body off directly, and it only ever sent subject + conversationId. Confirmed
    // live 2026-10-21 that this materially weaker signal produced few/no suggestions on a
    // reply, where File Email's richer from/to/cc/body-driven call (same /api/suggest backend)
    // reliably did. Fixed by pulling those fields from "the original" message instead -- the
    // same best-effort conversationId lookup findOriginalMessage() already needs for Save Both,
    // just started earlier (right alongside this, at sign-in) and reused by both rather than
    // run twice. Still silent-only here (isUserAction=false) -- see startOriginalMessageLookup().
    let sendSuggestions = [];

    async function fetchSuggestions() {
        try {
            const indexToken = await withTimeout(signInAndGetToken(indexRequest, false), 4000, "suggest: index token");
            if (!indexToken) return;
            const account = msalInstance.getActiveAccount();
            const params = new URLSearchParams({
                self: (account && account.username) || "",
                conversationId: sendContext.conversationId || "",
                subject: (sendContext.subject || "").slice(0, 1000)
            });
            if (isReplyLike) {
                const original = await withTimeout(startOriginalMessageLookup(), 4000, "suggest: original message lookup").catch(() => null);
                if (original) {
                    const addrList = (recipients) => (recipients || [])
                        .map(r => r.emailAddress && r.emailAddress.address).filter(Boolean).join(",");
                    params.set("from", (original.from && original.from.emailAddress && original.from.emailAddress.address) || "");
                    params.set("to", addrList(original.toRecipients));
                    params.set("cc", addrList(original.ccRecipients));
                    params.set("body", (original.bodyPreview || "").slice(0, 1000));
                }
            }
            const response = await withTimeout(fetch(`${SUGGEST_API_URL}/api/suggest?${params}`, {
                headers: { Authorization: `Bearer ${indexToken}` }
            }), 15000, "suggest: api call");
            if (!response.ok) return;
            const data = await response.json();
            sendSuggestions = data.suggestions || [];
            renderFolderList(document.getElementById("fosFilterBox").value);
        } catch (err) {
            console.error("Could not load suggested projects (non-fatal):", err);
        }
    }

    // ---- Step / project list ----

    function showStep(step) {
        document.querySelectorAll(".step").forEach(el => el.classList.remove("active"));
        document.getElementById(step).classList.add("active");
        document.getElementById("cancelRow").style.display = step === "stepCancelled" ? "none" : "flex";
        if (step === "stepConfirm") {
            // Save Both may still be disabled (original-message lookup in flight, or not
            // reply-like at all) -- land on whichever default action is actually usable.
            const both = document.getElementById("saveBothButton");
            const replyOnly = document.getElementById("saveReplyOnlyButton");
            if (!both.disabled) both.focus();
            else if (replyOnly.style.display !== "none") replyOnly.focus();
        }
        if (step === "stepPick") document.getElementById("fosFilterBox").focus();
    }

    let folderEntries = [];

    // Stale-while-revalidate, added 2026-10-24: this list rarely changes (new projects are
    // created at most a few times a week), but was being fetched fresh -- several parallel Graph
    // listings across both libraries and every branch combo -- on every single dialog open, with
    // nothing shown until it finished. initFolderList() now renders instantly from whatever was
    // cached last time, then always refreshes live in the background so a newly-created project
    // still shows up within moments without the user ever waiting on it. The refresh button
    // remains for "I need this to be current right now, don't make me wait for the background one."
    function folderEntriesCacheKey() {
        const account = msalInstance.getActiveAccount();
        return `feFolderEntriesCache:${(account && account.username) || "unknown"}`;
    }
    function readFolderEntriesCache() {
        try {
            const parsed = JSON.parse(localStorage.getItem(folderEntriesCacheKey()));
            return Array.isArray(parsed && parsed.entries) ? parsed.entries : null;
        } catch (err) { return null; }
    }
    function writeFolderEntriesCache(entries) {
        try { localStorage.setItem(folderEntriesCacheKey(), JSON.stringify({ entries, cachedAt: Date.now() })); }
        catch (err) { /* ignore storage errors */ }
    }

    async function loadFolderNames(silent) {
        const status = document.getElementById("listStatus");
        if (!silent) {
            status.style.color = "#333";
            status.textContent = "Loading Archive & Active project folders...";
        }
        try {
            const token = await signInAndGetToken(sitesRequest, true);
            if (!token) throw new Error("Could not get permission to access SharePoint.");

            const archiveCombos = Object.keys(ARCHIVE_BRANCH_PATH);
            const activeCombos = Object.keys(ACTIVE_BRANCH_PATH);
            const [archiveResults, activeResults] = await Promise.all([
                Promise.all(archiveCombos.map(async combo => {
                    const folders = await listFolders(ARCHIVE_DRIVE_ID, ARCHIVE_BRANCH_PATH[combo], token);
                    return folders.filter(f => !/template/i.test(f.name)).map(f => ({ name: f.name, combo, source: "Archive" }));
                })),
                Promise.all(activeCombos.map(async combo => {
                    const folders = await listFolders(ACTIVE_DRIVE_ID, ACTIVE_BRANCH_PATH[combo], token);
                    return folders.filter(f => !/template/i.test(f.name)).map(f => ({ name: f.name, combo, source: "Active" }));
                }))
            ]);

            folderEntries = [...archiveResults.flat(), ...activeResults.flat()];
            writeFolderEntriesCache(folderEntries);
            renderFolderList(document.getElementById("fosFilterBox").value);
            if (!silent) status.textContent = "";
        } catch (err) {
            console.error("Failed to load Archive/Active project folders:", err);
            // A silent (background) refresh failing is not worth alarming the user over --
            // whatever was already rendered from cache (or the prior successful load) stays
            // on screen untouched, and the next dialog open or manual refresh will try again.
            if (!silent) {
                status.textContent = `Error: ${err.message}`;
                status.style.color = "red";
            } else {
                console.warn("Background folder-list refresh failed; keeping the cached list on screen.");
            }
        }
    }

    function initFolderList() {
        const cached = readFolderEntriesCache();
        const hadCache = Array.isArray(cached) && cached.length > 0;
        if (hadCache) {
            folderEntries = cached;
            renderFolderList(document.getElementById("fosFilterBox").value);
        }
        return loadFolderNames(hadCache);
    }

    function refreshFolderList() {
        const btn = document.getElementById("refreshListButton");
        btn.classList.add("spinning");
        loadFolderNames(false).finally(() => {
            setTimeout(() => btn.classList.remove("spinning"), 400);
            document.getElementById("listStatus").textContent = "Updated just now.";
        });
    }

    // Real DOM focus drives keyboard nav here (not a virtual highlight index) -- matches
    // the approved mockup, and gives screen readers/native focus styling for free.
    let filteredEntries = [];

    function renderFolderList(filter) {
        const list = document.getElementById("folderList");
        list.innerHTML = "";
        const selectedService = document.querySelector('input[name="fosService"]:checked').value;
        const normalizedFilter = (filter || "").toLowerCase();

        // Suggested rows: only while the search box is empty, and only entries that still
        // resolve to a real, currently-listed folder matching the current service filter --
        // re-checked at every render, not just once (HANDOFF_MLPredictor_DeepDive.md §9).
        const suggestedEntries = [];
        if (!normalizedFilter) {
            const seen = new Set();
            for (const s of sendSuggestions) {
                const match = folderEntries.find(entry =>
                    matchesProjectCode(entry.name, s.projectCode) && serviceFilterMatches(selectedService, entry.combo));
                if (!match || seen.has(match.name)) continue;
                seen.add(match.name);
                suggestedEntries.push({ ...match, suggested: true, reason: s.reason });
            }
        }
        const suggestedNames = new Set(suggestedEntries.map(e => e.name));

        filteredEntries = [
            ...suggestedEntries,
            ...folderEntries
                .filter(entry => serviceFilterMatches(selectedService, entry.combo))
                .filter(entry => entry.name.toLowerCase().includes(normalizedFilter))
                .filter(entry => !suggestedNames.has(entry.name))
                .sort((a, b) => extractProjectNumber(b.name) - extractProjectNumber(a.name))
        ];

        if (filteredEntries.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty-message";
            empty.textContent = "No matching project folders found.";
            list.appendChild(empty);
            return;
        }

        filteredEntries.forEach((entry, index) => {
            const item = document.createElement("div");
            item.className = "folder-item" + (entry.suggested ? " suggested" : "");
            item.tabIndex = -1;

            const name = document.createElement("span");
            name.className = "name";
            name.textContent = entry.suggested ? `Suggested — ${entry.name}` : entry.name;
            item.appendChild(name);

            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = entry.suggested ? entry.reason : `${entry.combo} · ${entry.source}`;
            item.appendChild(tag);

            item.addEventListener("click", () => selectProject(entry.name, item));
            item.addEventListener("keydown", (e) => handleListItemKeydown(e, item, index));
            list.appendChild(item);
        });
    }

    function handleFilterKeydown(e) {
        if (e.key === "ArrowDown" && filteredEntries.length) {
            e.preventDefault();
            document.getElementById("folderList").querySelectorAll(".folder-item")[0].focus();
        }
    }

    function handleListItemKeydown(e, item, index) {
        const items = document.getElementById("folderList").querySelectorAll(".folder-item");
        if (e.key === "ArrowDown") {
            e.preventDefault();
            if (index < items.length - 1) items[index + 1].focus();
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            if (index === 0) document.getElementById("fosFilterBox").focus();
            else items[index - 1].focus();
        } else if (e.key === "Enter") {
            e.preventDefault();
            selectProject(filteredEntries[index].name, item);
        }
    }

    let selectedProjectName = null;
    let originalMessage = null; // populated best-effort for reply/forward, see findOriginalMessage

    function selectProject(name, el) {
        selectedProjectName = name;
        document.querySelectorAll(".folder-item.selected").forEach(n => n.classList.remove("selected"));
        el.classList.add("selected");
        document.getElementById("confirmProject").textContent = name;

        const originalContext = document.getElementById("confirmOriginalContext");
        if (isReplyLike) {
            originalContext.style.display = "block";
            document.getElementById("confirmOriginalLine").innerHTML = "&#129525; <b>Original</b> &mdash; looking it up...";
            // Disabled until the lookup resolves either way -- don't let "Save Both" be
            // clicked before we actually know whether there's an original to attach.
            document.getElementById("saveBothButton").disabled = true;

            const applyOriginalMessage = (msg) => {
                originalMessage = msg;
                if (msg) {
                    const from = (msg.from && msg.from.emailAddress && (msg.from.emailAddress.name || msg.from.emailAddress.address)) || "unknown sender";
                    const when = msg.receivedDateTime ? new Date(msg.receivedDateTime).toLocaleDateString() : "";
                    // TEMPORARY diagnostic line (2026-10-25) -- remove once the inReplyTo path is
                    // confirmed working live.
                    const diag = `<div style="font-size:10px;color:#B3401F">DIAG: ${lastOriginalLookupMethod || "(no method recorded)"}</div>`;
                    document.getElementById("confirmOriginalLine").innerHTML =
                        `&#129525; <b>Original</b> &mdash; "${msg.subject || sendContext.subject}" from ${from}${when ? ", " + when : ""}${diag}`;
                    document.getElementById("saveBothButton").disabled = false;
                    // Save Both is the default action once it's actually usable -- move
                    // focus to it, but only if focus is still sitting on the fallback
                    // (Reply Only) from showStep's landing choice, not if the user already
                    // deliberately moved away from it.
                    if (document.activeElement && document.activeElement.id === "saveReplyOnlyButton") {
                        document.getElementById("saveBothButton").focus();
                    }
                } else {
                    const why = lastOriginalLookupResult && lastOriginalLookupResult.reason
                        ? ` (${lastOriginalLookupResult.reason})`
                        : "";
                    document.getElementById("confirmOriginalLine").innerHTML =
                        `Original message not found -- only the reply can be filed.${why}` +
                        `<div style="font-size:10px;color:#B3401F">DIAG: ${lastOriginalLookupMethod || "(no method recorded)"}</div>`;
                    document.getElementById("saveBothButton").disabled = true;
                }
            };

            // Reuses the same lookup already kicked off (silently) for suggestions -- avoids a
            // second Graph round-trip in the common case. If that silent attempt came back empty
            // (no cached token yet, rather than a genuine "no original" result), retry once here
            // with an interactive-capable token, since picking a project is a deliberate user
            // action that justifies a consent prompt if one's actually still needed.
            startOriginalMessageLookup().then(msg => {
                if (msg) { applyOriginalMessage(msg); return; }
                findOriginalMessage(true).then(applyOriginalMessage);
            });
        } else {
            originalContext.style.display = "none";
        }

        showStep("stepConfirm");
    }

    function handleConfirmButtonKeydown(e) {
        const order = isReplyLike
            ? ["saveBothButton", "categoriseConversationButton", "saveReplyOnlyButton"]
            : ["saveBothButton"];
        const i = order.indexOf(e.target.id);
        if (e.key === "ArrowDown" && i < order.length - 1) {
            e.preventDefault();
            document.getElementById(order[i + 1]).focus();
        } else if (e.key === "ArrowUp" && i > 0) {
            e.preventDefault();
            document.getElementById(order[i - 1]).focus();
        }
    }

    // "What am I replying to": primarily an EXACT match via inReplyTo (added 2026-10-25),
    // falling back to the old best-effort conversationId heuristic when that's not available.
    //
    // sendContext.inReplyToMessageId is set by taskpane.html before this dialog ever opens
    // (dialogs have no Office.context.mailbox of their own, so they can't read it directly) --
    // it comes from Office.js's LoadedMessageCompose.inReplyTo, which carries the ORIGINAL
    // message's actual internetMessageId (confirmed via its underlying MAPI property,
    // PidTagInReplyToId), not an approximation. Looking that exact ID up via Graph
    // ($filter=internetMessageId eq ...) is immune to the old heuristic's known failure modes:
    // confirmed live 2026-10-25 that "most recent non-self message in this conversationId" had
    // picked a self-forward sitting in Sent Items instead of the actual Inbox original, and
    // Microsoft's own docs note inReplyTo survives a subject edit, which conversationId does not
    // reliably. Only documented for replies, not confirmed for forwards -- if it's not set (or
    // the lookup finds nothing), this falls through to the conversationId search below exactly
    // as before, so forwards (and any other case where it's absent) still work, just with the
    // old approximation.
    //
    // conversationId fallback: approximates "the original" as the most recent message in the
    // same conversation that wasn't sent by the signed-in user themselves (their own prior
    // replies also share the conversationId). Good enough for the common case; if it can't find
    // anything, "Save Both" is disabled above rather than filing something wrong.
    //
    // $select includes toRecipients/ccRecipients/bodyPreview (added 2026-10-21) so the same
    // lookup also feeds fetchSuggestions() -- previously that only had subject+conversationId
    // to go on, a much weaker signal than File Email's from/to/cc/body-driven suggestions
    // against the same /api/suggest backend. isUserAction is passed through rather than fixed:
    // the early, suggestions-driven call must stay silent (startOriginalMessageLookup() below),
    // while selectProject()'s own fallback call may prompt interactively, since by then the user
    // has taken a deliberate action.
    // lastOriginalLookupResult records *why* the most recent call came back empty (no
    // conversationId at all, no token, zero Graph matches, or matches that were all sent by the
    // signed-in user) -- added 2026-10-21 so selectProject()'s "not found" message can say which
    // of those actually happened, confirmed live to matter: a reply to a genuine external sender
    // still came back "not found", which this alone can't explain without knowing whether Graph
    // returned zero messages for the conversationId (points at a conversationId mismatch) or
    // returned messages that were all attributed to the signed-in user (points at the "not sent
    // by me" matching logic itself, or a shared/delegate-mailbox from-address mismatch).
    let lastOriginalLookupResult = null;
    // TEMPORARY diagnostic (2026-10-25), remove once the inReplyTo path is confirmed working live:
    // records which method actually produced the result, and the raw inReplyToMessageId received
    // from the opener, so this can be surfaced directly in the dialog's own UI without DevTools.
    let lastOriginalLookupMethod = null;

    const ORIGINAL_MESSAGE_SELECT = "id,subject,from,toRecipients,ccRecipients,bodyPreview,receivedDateTime";

    async function findOriginalMessage(isUserAction) {
        try {
            const token = await signInAndGetToken(mailWriteRequest, isUserAction);
            if (!token) {
                lastOriginalLookupResult = { reason: "could not get permission to check (no token)" };
                return null;
            }

            if (sendContext.inReplyToMessageId) {
                try {
                    const exactUrl = "https://graph.microsoft.com/v1.0/me/messages?$filter=" +
                        encodeURIComponent(`internetMessageId eq '${sendContext.inReplyToMessageId}'`) +
                        `&$top=1&$select=${ORIGINAL_MESSAGE_SELECT}`;
                    const exactData = await graphGet(exactUrl, token);
                    const exactMatch = (exactData.value || [])[0];
                    if (exactMatch) {
                        lastOriginalLookupMethod = `exact inReplyTo match (${sendContext.inReplyToMessageId})`;
                        return exactMatch;
                    }
                    lastOriginalLookupMethod = `inReplyTo was "${sendContext.inReplyToMessageId}" but no message with that internetMessageId was found -- fell back to conversationId`;
                } catch (err) {
                    console.error("Exact inReplyTo lookup failed, falling back to conversation search:", err);
                    lastOriginalLookupMethod = `exact lookup threw (${err.message || err}) -- fell back to conversationId`;
                }
                // Falls through deliberately -- inReplyTo was set but didn't resolve to a message
                // (deleted since, or some other edge case). The conversationId search below is
                // still worth trying rather than giving up immediately.
            } else {
                lastOriginalLookupMethod = sendContext.inReplyToDiagError
                    ? `getInReplyToMessageId() threw on the opener side: "${sendContext.inReplyToDiagError}" -- used conversationId fallback`
                    : "no inReplyToMessageId was received (Outlook gave null, no error) -- used conversationId fallback directly";
            }

            if (!sendContext.conversationId) {
                lastOriginalLookupResult = { reason: "no conversationId was available to search with" };
                return null;
            }
            const account = msalInstance.getActiveAccount();
            const myAddress = (account && account.username || "").toLowerCase();
            // Confirmed live 2026-10-21: filtering /me/messages by conversationId while also
            // sorting by receivedDateTime hits Graph's own "InefficientFilter" error ("The
            // restriction or sort order is too complex for this operation"). First attempted fix
            // (ConsistencyLevel: eventual + $count=true, "advanced query parameters") did NOT
            // resolve it -- confirmed live, identical error persisted. Root cause per Graph's own
            // docs (List messages): when $filter and $orderby are combined, every property in
            // $orderby must also appear in $filter, in matching order -- receivedDateTime was
            // only ever in $orderby here, never in $filter, which breaks that rule outright and
            // isn't something advanced query parameters can override. Fixed properly by dropping
            // $orderby entirely and sorting the (small, $top=25) result set client-side instead --
            // there's no ordering requirement left to violate.
            const url = "https://graph.microsoft.com/v1.0/me/messages?$filter=" +
                encodeURIComponent(`conversationId eq '${sendContext.conversationId}'`) +
                `&$top=25&$select=${ORIGINAL_MESSAGE_SELECT}`;
            const data = await graphGet(url, token);
            const messages = (data.value || []).slice()
                .sort((a, b) => new Date(b.receivedDateTime) - new Date(a.receivedDateTime));
            const found = messages.find(m => {
                const addr = (m.from && m.from.emailAddress && m.from.emailAddress.address || "").toLowerCase();
                return addr && addr !== myAddress;
            }) || null;
            if (!found) {
                lastOriginalLookupResult = messages.length === 0
                    ? { reason: `Graph found 0 messages for this conversationId (self=${myAddress || "?"})` }
                    : { reason: `Graph found ${messages.length} message(s) in this thread, but every one was attributed to ${myAddress || "you"}` };
            }
            return found;
        } catch (err) {
            console.error("Could not look up the original message:", err);
            lastOriginalLookupResult = { reason: `lookup failed: ${err.message || err}` };
            return null;
        }
    }

    // Kicks off findOriginalMessage() at most once per dialog instance, silently (isUserAction=
    // false -- this fires proactively alongside fetchSuggestions(), before the user has done
    // anything, so it must never pop an interactive sign-in prompt). Shared by fetchSuggestions()
    // and selectProject() so both reuse one Graph call instead of each doing their own.
    let originalMessagePromise = null;

    function startOriginalMessageLookup() {
        if (!originalMessagePromise) {
            originalMessagePromise = isReplyLike ? findOriginalMessage(false) : Promise.resolve(null);
        }
        return originalMessagePromise;
    }

    // ---- Shared File Email batch-tracking plumbing (ported from file-email-dialog.html) ----
    // Reused as-is so a failure here surfaces in the exact same "Recent File Email
    // batches" notice that File Email's own dialog already shows -- same localStorage key.

    const FE_BATCHES_STORAGE_KEY = "fileEmailPendingBatches";

    function getFeBatchesFromStorage() {
        try { return JSON.parse(localStorage.getItem(FE_BATCHES_STORAGE_KEY) || "[]"); }
        catch (err) { return []; }
    }
    function saveFeBatchesToStorage(batches) {
        try { localStorage.setItem(FE_BATCHES_STORAGE_KEY, JSON.stringify(batches)); }
        catch (err) { console.error("Could not persist File on Send batch tracking:", err); }
    }
    function addFeBatchToStorage(entry) {
        const batches = getFeBatchesFromStorage();
        batches.push(entry);
        saveFeBatchesToStorage(batches);
    }
    function removeFeBatchFromStorage(batchId) {
        saveFeBatchesToStorage(getFeBatchesFromStorage().filter(b => b.batchId !== batchId));
    }

    async function findMasterCategory(categoryName) {
        const token = await signInAndGetToken(mailWriteRequest, true);
        if (!token) throw new Error("Could not get permission to read mailbox categories.");
        const result = await graphGet("https://graph.microsoft.com/v1.0/me/outlook/masterCategories", token);
        return (result.value || []).find(c => c.displayName === categoryName) || null;
    }

    // Acquires both tokens concurrently (independent resources -- no reason to serialize them)
    // and posts the batch, returning the bridge's full response.
    //
    // HISTORY: a 2026-10-24 revision split this into { sent, result } so the caller could await
    // only `sent` (tokens acquired, fetch() issued) and close the dialog immediately, treating
    // `result` as fire-and-forget -- on the theory that `keepalive: true` would let the request
    // keep running on the server even after the page closed. REVERTED 2026-10-25: confirmed live
    // via Application Insights that this doesn't hold -- closing the dialog tears down the
    // underlying connection fast enough that the bridge's invocation gets cancelled mid-flight
    // (a TaskCanceledException after ~2.4s, nowhere near enough time for its Graph calls to
    // finish), so the categorize PATCH silently never happened despite keepalive. `keepalive` is
    // kept below as a defensive measure for the rare case this dialog gets torn down some other
    // way mid-request (e.g. the user force-closing it), but callers must actually await this
    // function's result for the categorize to be relied upon -- see categorizeBatch.
    async function postFeBatch(entry) {
        const [graphToken, bridgeToken] = await signInAndGetTwoTokens(mailWriteRequest, bridgeRequest, true);
        if (!graphToken) throw new Error("Could not get permission to categorize/move emails.");
        if (!bridgeToken) throw new Error("Could not get permission to call the bridge.");

        // This dialog only ever categorises a handful of messages at a time (the original, or
        // every message in one conversation), nowhere near browsers' ~64KB keepalive request cap
        // in the normal case -- but an unusually long thread could get close, so the cap is
        // checked explicitly rather than assumed. (File Email's own copy of this function can
        // carry a much larger multi-item batch and deliberately never uses keepalive at all.)
        const body = JSON.stringify({
            graphAccessToken: graphToken,
            categoryName: entry.categoryName,
            destinationFolderId: entry.destinationFolderId,
            items: entry.items
        });
        const response = await fetch(`${BRIDGE_URL}/api/file-email-batch/${entry.batchId}`, {
            method: "POST",
            keepalive: body.length < 60 * 1024,
            headers: { Authorization: `Bearer ${bridgeToken}`, "Content-Type": "application/json" },
            body
        });
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Bridge returned ${response.status}: ${errorText}`);
        }
        return response.json();
    }

    // Fires a categorize-only batch through the exact same bridge endpoint File Email already
    // uses, with no destinationFolderId -- see FileEmailBatch/run.ps1's own branch for this
    // ("status = categorized-not-staged" when no destination is given). Shared by
    // fileOriginalMessage() (one item: the original) and categoriseConversation() (every message
    // in the thread). The batch is durably tracked in storage before the request goes out --
    // if this dialog closes or crashes mid-request regardless, File Email's own stuck-batch
    // recovery still picks it up later.
    //
    // BUG FOUND LIVE 2026-10-21 (historical, kept for context): an earlier version of this flow
    // moved the original into "Emails to File" immediately as part of the same call, racing a
    // fixed close-timer against it that usually lost, leaving it "stuck" until File Email's own
    // recovery retried it. REVISED 2026-10-25: this dialog no longer moves anything at all, ever
    // -- it was ALSO found to drag an open, in-progress reply/forward draft along with it when it
    // relocated the original (the original's own compose window side-effect, not a timing bug).
    // Categorizing in place has no such effect, and the user now moves a categorized item into
    // "Emails to File" themselves whenever they're ready, same as File Email's own staging step.
    // Awaits the bridge's FULL response (see postFeBatch's own comment for why a fire-and-forget
    // version of this doesn't work) -- categorize-only is fast now that this flow no longer also
    // moves anything (two Graph calls, not three, per item), so waiting for it is a small,
    // worthwhile cost for it to actually happen.
    async function categorizeBatch(categoryName, items, statusElementId) {
        const categoryPreExisted = (await findMasterCategory(categoryName).catch(() => null)) !== null;

        const batchId = crypto.randomUUID();
        const now = new Date().toISOString();
        const batchEntry = {
            batchId, categoryName, total: items.length,
            startedAt: now, lastAttemptAt: now, retryCount: 0,
            items, destinationFolderId: null, categoryPreExisted
        };
        // Durably tracked before the request even starts -- if this dialog is closed or crashes
        // mid-request regardless, File Email's own stuck-batch recovery still picks it up later.
        addFeBatchToStorage(batchEntry);

        try {
            const r = await postFeBatch(batchEntry);
            removeFeBatchFromStorage(batchId);
            if (statusElementId) {
                const failed = (r && r.failed) || 0;
                document.getElementById(statusElementId).textContent = failed > 0
                    ? `Categorised ${r.succeeded || 0} of ${items.length} -- ${failed} failed (will retry via File Email).`
                    : `Categorised ${items.length} message(s).`;
            }
        } catch (err) {
            console.error("Categorizing failed:", err);
            // Left in storage -- File Email's own stuck-batch recovery will retry it next time
            // it opens, same safety net as any other batch that fails outright.
            if (statusElementId) {
                document.getElementById(statusElementId).textContent =
                    `Could not categorise right now -- it's queued and will be retried automatically next time File Email opens. (${err.message || err})`;
            }
        }
    }

    async function fileOriginalMessage(categoryName) {
        if (!originalMessage) return;
        document.getElementById("confirmOriginalLine").textContent = "Categorising the original...";
        document.getElementById("cancelLink").disabled = true;
        await categorizeBatch(
            categoryName,
            [{ restId: originalMessage.id, subject: originalMessage.subject || sendContext.subject }],
            "confirmOriginalLine"
        );
    }

    // "Categorise Conversation": every message in the thread, not just the one found as "the
    // original" -- a plain conversationId search, no attempt to guess which one is "the
    // original" the way findOriginalMessage() does, since every match gets categorized anyway.
    // /me/messages searches the whole mailbox (not folder-scoped), so this naturally picks up
    // Inbox, Sent Items, and any subfolder the thread's messages happen to sit in.
    async function fetchConversationMessages(conversationId, token) {
        let url = "https://graph.microsoft.com/v1.0/me/messages?$filter=" +
            encodeURIComponent(`conversationId eq '${conversationId}'`) +
            "&$top=50&$select=id,subject";
        const messages = [];
        while (url) {
            const page = await graphGet(url, token);
            messages.push(...(page.value || []));
            url = page["@odata.nextLink"] || null;
        }
        return messages;
    }

    async function categoriseConversation(categoryName) {
        const statusEl = document.getElementById("confirmOriginalLine");
        const contextBox = document.getElementById("confirmOriginalContext");
        contextBox.style.display = "block";
        statusEl.textContent = "Finding every message in this conversation...";
        document.getElementById("cancelLink").disabled = true;

        if (!sendContext.conversationId) {
            statusEl.textContent = "Could not categorise the conversation: no conversation to search.";
            return;
        }
        let messages;
        try {
            const token = await signInAndGetToken(mailWriteRequest, true);
            if (!token) throw new Error("Could not get permission to search the mailbox.");
            messages = await fetchConversationMessages(sendContext.conversationId, token);
        } catch (err) {
            console.error("Could not look up the conversation's messages:", err);
            statusEl.textContent = `Could not categorise the conversation: ${err.message || err}`;
            return;
        }
        if (messages.length === 0) {
            statusEl.textContent = "No other messages found in this conversation yet.";
            return;
        }

        statusEl.textContent = `Categorising ${messages.length} message(s) in this conversation...`;
        await categorizeBatch(
            categoryName,
            messages.map(m => ({ restId: m.id, subject: m.subject })),
            "confirmOriginalLine"
        );
    }

    // ---- Confirm / Cancel ----

    function disableConfirmButtons() {
        document.getElementById("saveBothButton").disabled = true;
        document.getElementById("saveReplyOnlyButton").disabled = true;
        document.getElementById("categoriseConversationButton").disabled = true;
    }

    // Brief pause after the real work (categorizeBatch awaits the bridge's full
    // response, see its own comment) so the final status line is actually readable before the
    // dialog vanishes -- not hiding any remaining wait, there isn't one left at this point.
    function closeDialogSoon() {
        setTimeout(() => {
            try { Office.context.ui.closeContainer(); } catch (err) { window.close(); }
        }, 700);
    }

    async function handleSave(saveOriginal) {
        disableConfirmButtons();

        // Tell the opener right away -- it's the only side that can tag the outgoing
        // item and let the send through, and there's no reason to make it wait on
        // anything below.
        messageParent({ action: "save", categoryName: selectedProjectName });

        if (saveOriginal && isReplyLike && originalMessage) {
            await fileOriginalMessage(selectedProjectName);
        }
        closeDialogSoon();
    }

    // "Categorise Conversation" -- tags the outgoing reply/forward exactly like the other two
    // buttons, plus every other message already in the thread (see categoriseConversation()).
    async function handleSaveConversation() {
        disableConfirmButtons();
        messageParent({ action: "save", categoryName: selectedProjectName });
        await categoriseConversation(selectedProjectName);
        closeDialogSoon();
    }

    function handleCancel() {
        messageParent({ action: "cancel" });
        showStep("stepCancelled");
        setTimeout(() => {
            try { Office.context.ui.closeContainer(); } catch (err) { window.close(); }
        }, 900);
    }

    // No category, no filing of anything -- just let the send through untagged. No
    // in-flight request to abort here, so there's no reason to delay closing at all.
    function handleSkip() {
        messageParent({ action: "skip" });
        try { Office.context.ui.closeContainer(); } catch (err) { window.close(); }
    }
  </script>
</body>
</html>
