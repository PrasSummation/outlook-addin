<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>File Email</title>
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
  <style>
    :root{
      --green:#408F4E; --green-dark:#2D6B38; --green-pale:#EDF7EE;
      --grey-900:#2B2B2B; --grey-600:#646464; --grey-400:#909090;
      --grey-500:#787878; --grey-300:#B4B4B4; --grey-200:#DCDCDC; --grey-100:#EFEFEF; --grey-50:#F7F7F7;
      --font-display:'Bahnschrift','DIN Alternate','Segoe UI',sans-serif;
      --font-body:'Calibri','Segoe UI',system-ui,sans-serif;
      --font-mono:'Consolas','Courier New',monospace;
    }
    *{box-sizing:border-box}
    body{margin:0;padding:0;background:#fff;font-family:var(--font-body);
         font-size:13px;line-height:1.5;color:var(--grey-600);-webkit-font-smoothing:antialiased}
    a{color:var(--green-dark);text-decoration:none}
    a:hover{color:var(--green);text-decoration:underline}

    #brandBar{background:var(--grey-900);padding:14px 20px;display:flex;align-items:center;gap:10px}
    #brandBar img{width:26px;height:26px}
    #brandBar .word{font-family:var(--font-display);font-size:14px;font-weight:600;color:#fff;letter-spacing:.14em}
    #brandBar .sub{font-size:10.5px;color:var(--grey-400);letter-spacing:.05em}

    #signInPrompt{padding:60px 24px;text-align:center}
    #signInPrompt p{margin:0 0 20px;font-size:13px;color:var(--grey-600)}
    #signInButton{padding:10px 24px;font:600 13px var(--font-body);color:#fff;background:var(--green);
      border:1px solid var(--green);border-radius:4px;cursor:pointer}
    #signInButton:hover{background:var(--green-dark)}

    #appBody{max-width:520px;margin:0 auto;padding:16px 22px 22px}

    label{display:block;width:100%;margin:12px 0 6px;font-size:10px;letter-spacing:.09em;
      text-transform:uppercase;color:var(--grey-400)}
    label:first-of-type{margin-top:0}
    input[type=text]{display:block;width:100%;margin:0 0 10px;padding:8px 10px;
      font:400 13px/1.4 var(--font-body);color:var(--grey-900);background:#fff;
      border:1.5px solid var(--grey-200);border-radius:4px}
    input[type=text]:focus{outline:none;border-color:var(--green)}
    button{display:block;width:100%;margin:0 0 9px;padding:11px 12px;
      font:600 13px/1.2 var(--font-body);letter-spacing:.02em;color:#fff;
      background:var(--green);border:1px solid var(--green);border-radius:6px;cursor:pointer}
    button:hover{background:var(--green-dark);border-color:var(--green-dark)}
    button:disabled{background:var(--grey-100);border-color:var(--grey-200);color:var(--grey-500);cursor:not-allowed}
    button .hint{display:block;font-weight:400;font-size:10.5px;color:#DDF0E0;margin-top:2px}
    .link-button{appearance:none;border:none;background:none;color:var(--grey-600);
      font:600 11.5px/1.2 var(--font-body);cursor:pointer;padding:6px 2px;text-align:left;width:auto;display:inline-block}
    .link-button:hover{color:var(--grey-900);text-decoration:underline}

    .radio-row{display:flex;gap:16px;margin-bottom:10px}
    .radio-row label{display:flex;align-items:center;gap:6px;width:auto;margin:0;
      font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--grey-900)}
    .radio-row input{display:inline-block;width:auto;margin:0;accent-color:var(--green)}

    .list-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:12px 0 6px}
    .list-head label{margin:0}
    #feRefreshListButton{flex:none;width:24px;height:24px;margin:0;padding:0;border-radius:6px;
      border:1px solid var(--grey-200);background:#fff;color:var(--grey-600);font-size:13px;
      display:flex;align-items:center;justify-content:center;transition:transform 400ms ease}
    #feRefreshListButton:hover{background:#fff;border-color:var(--grey-400);color:var(--grey-900)}
    #feRefreshListButton.spinning{transform:rotate(300deg)}

    #feFolderList{max-height:260px;overflow-y:auto;border:1px solid var(--grey-200);border-radius:8px;margin-top:0}
    .folder-item{display:flex;justify-content:space-between;align-items:center;gap:10px;
      padding:9px 11px;border-bottom:1px solid var(--grey-100);cursor:pointer;font-size:12.5px}
    .folder-item:last-child{border-bottom:none}
    .folder-item:hover{background:var(--grey-50)}
    .folder-item.selected{background:var(--green-pale);box-shadow:inset 2px 0 0 var(--green)}
    .folder-item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--grey-900)}
    .folder-item .tag{flex:none;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.03em;color:var(--grey-400)}
    .empty-message{padding:12px;color:var(--grey-400);font-size:12px}
    #feSetupStatus{font-size:10.5px;color:var(--grey-400);margin-top:6px}

    .summary-box{border:1px solid var(--grey-200);border-radius:8px;padding:14px;font-size:12.5px;background:var(--grey-50)}
    .summary-box .row{margin-bottom:6px}
    .summary-box .row:last-child{margin-bottom:0}
    .summary-box .label{font-weight:600;color:var(--grey-900)}
    .warning-box{border:1px solid #E78707;background:#FFF8E1;color:#7A5B00;border-radius:4px;
      padding:10px;font-size:12px;margin-bottom:10px}

    #feNoSelection{font-size:12px;color:var(--grey-600)}
  </style>
</head>
<body>
  <div id="brandBar">
    <img src="https://prassummation.github.io/outlook-addin/logo-symbol-32x32.png" alt="Summation" />
    <div>
      <div class="word">SUMMATION</div>
      <div class="sub">File Email</div>
    </div>
  </div>

  <div id="signInPrompt">
    <p>Please sign in to file this email.</p>
    <button id="signInButton">Sign In</button>
  </div>

  <div id="appBody" style="display:none;">
    <div id="fePendingBatches"></div>

    <div id="feStepPick">
      <div id="feContextSummary"></div>
      <div id="feNoSelection" style="display: none;">
        <p>Select one or more emails in the list — this updates automatically, no need to close this window.</p>
      </div>
      <div id="fePickBody" style="display: none;">
        <label>Service</label>
        <div class="radio-row">
          <label><input type="radio" name="feService" value="Sustainability" checked /> Sustainability</label>
          <label><input type="radio" name="feService" value="Energy" /> Energy</label>
        </div>
        <div class="list-head">
          <label for="feFilterBox" style="margin:0">Search Archive &amp; Active project folders</label>
          <button type="button" id="feRefreshListButton" title="Refresh project list">&#8635;</button>
        </div>
        <input type="text" id="feFilterBox" placeholder="Type to search, &darr; to browse the list..." />
        <div id="feFolderList"></div>
        <div id="feSetupStatus"></div>
      </div>
    </div>

    <div id="feStepConfirm" style="display: none;">
      <div id="feConfirmSummary"></div>
      <button id="feConfirmButton">
        Add Category &amp; Stage for Filing
        <span class="hint">Tags the email(s) and queues them for background filing</span>
      </button>
      <button id="feBackToPickButton" class="link-button">&larr; Choose a Different Project</button>
    </div>

    <div id="feStepResult" style="display: none;">
      <div id="feResultSummary"></div>
      <button id="feStartOverButton">File Another</button>
      <button id="feCloseButton" class="link-button">Close</button>
    </div>
  </div>

  <script>
    // File Email's picker, as a dialog window (Office.context.ui.displayDialogAsync) rather
    // than inline in the taskpane sidebar. Why: a task pane that Outlook opens *fresh* (via
    // the ribbon's dedicated File Email button) wasn't reliably getting real OS keyboard
    // focus -- confirmed in real Outlook, even after retrying .focus() on a timer and on
    // window focus/visibilitychange events. Opening this as a dialog instead sidesteps that
    // entirely, since Outlook hosts are expected to give dialogs real focus on creation.
    //
    // Trade-off called out when this was still inline (see taskpane.html's git history):
    // a one-shot dialog can't call Office.context.mailbox itself (dialogs don't get that
    // API at all, only office.context.ui.* for parent/child messaging) -- so it can't
    // re-detect the selection on its own the way the inline version did via
    // SelectedItemsChanged. The fix: whichever context opened this dialog (taskpane.html's
    // fileEmailButton, or commands.js's ribbon-triggered handler) keeps its own
    // SelectedItemsChanged listener running for as long as this dialog is open, and forwards
    // every change in here via dialog.messageChild(...) -- see onParentMessage below.
    //
    // Everything else (project search/pick, Confirm, the categorize+move batch, and the
    // pending-batch retry/dismiss UI) is ported near-verbatim from the old inline
    // implementation -- same bridge endpoint, same localStorage-tracked batches (this page
    // is same-origin with taskpane.html, so it shares that localStorage and the MSAL token
    // cache -- expected standard same-origin dialog behavior, worth confirming once this is
    // actually tested live).

    const BRIDGE_URL = "https://summation-exchange-bridge-e6e5gsendkdxdwf5.australiaeast-01.azurewebsites.net";
    const ACTIVE_DRIVE_ID = "b!6LWosCcMRkupf-n3ZowwIVyhngMkW-pOtIqfTmHpQ5wp-OK02_E3RbZkRH_jE_Lr";
    const ARCHIVE_DRIVE_ID = "b!6LWosCcMRkupf-n3ZowwIVyhngMkW-pOtIqfTmHpQ5zGiD4R7k2PQZMwL6mUreXS";
    const ACTIVE_BRANCH_PATH = {
        SUPER: "Sustainability/Perth", SUADL: "Sustainability/Adelaide",
        ENPER: "Energy/Perth", ENADL: "Energy/Adelaide"
    };
    const ARCHIVE_BRANCH_PATH = {
        SUPER: "Sustainability/Perth", SUADL: "Sustainability/Archived_Adelaide",
        ENPER: "Energy/Perth", ENADL: "Energy/Adelaide"
    };

    const msalConfig = {
      auth: {
        clientId: "80497ed0-ecd5-475e-97e0-5c9e90fb8a0d",
        authority: "https://login.microsoftonline.com/ecb5f458-9548-4e8b-96f3-904f1828f931",
        redirectUri: window.location.origin + window.location.pathname
      },
      cache: { cacheLocation: "localStorage", storeAuthStateInCookie: false }
    };

    const graphRequest = { scopes: ["User.Read"] };
    const sitesRequest = { scopes: ["Sites.Selected"] };
    const bridgeRequest = { scopes: ["api://80497ed0-ecd5-475e-97e0-5c9e90fb8a0d/MailboxBridge.Call"] };
    const mailWriteRequest = { scopes: ["Mail.ReadWrite", "MailboxSettings.ReadWrite"] };

    let msalInstance;

    // Same pattern as complete-action.html -- warn before an in-flight Graph/bridge call is
    // abandoned by closing this window, even though the bridge itself keeps the actual
    // categorize+move running server-side regardless (see postFeBatch's own comment).
    let actionInProgress = false;
    window.addEventListener("beforeunload", (e) => {
        if (actionInProgress) {
            e.preventDefault();
            e.returnValue = "";
        }
    });

    async function guardAgainstClose(fn) {
        actionInProgress = true;
        try {
            return await fn();
        } finally {
            actionInProgress = false;
        }
    }

    // ---- Initial context from the URL (whatever the opener detected at open time) ----
    let feState = { mode: "none", items: [] };
    (function captureInitialContext() {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get("context");
        if (!raw) return;
        try {
            const parsed = JSON.parse(raw);
            feState.mode = parsed.mode || "none";
            feState.items = parsed.items || [];
        } catch (err) {
            console.error("Malformed initial context from opener:", err);
        }
    })();

    Office.onReady(() => {
        document.getElementById("signInButton").addEventListener("click", handleLogin);
        document.getElementById("feFilterBox").addEventListener("input", () => renderFeFolderList(document.getElementById("feFilterBox").value));
        document.getElementById("feFilterBox").addEventListener("keydown", handleFeFilterKeydown);
        document.querySelectorAll('input[name="feService"]').forEach(el =>
            el.addEventListener("change", () => renderFeFolderList(document.getElementById("feFilterBox").value))
        );
        document.getElementById("feConfirmButton").addEventListener("click", handleFeConfirm);
        document.getElementById("feRefreshListButton").addEventListener("click", refreshFeFolderList);
        document.getElementById("feBackToPickButton").addEventListener("click", () => showFeStep("pick"));
        document.getElementById("feStartOverButton").addEventListener("click", resetToPick);
        document.getElementById("feCloseButton").addEventListener("click", () => {
            try { Office.context.ui.closeContainer(); } catch (err) { window.close(); }
        });

        // Enter anywhere on the Confirm step accepts it, like a dialog's default button --
        // except when focus is already on a button (the "Choose a Different Project" one),
        // which already handles its own Enter natively; acting again here too would both go
        // back AND immediately confirm in the same keystroke.
        document.addEventListener("keydown", (e) => {
            if (e.key !== "Enter") return;
            if (document.getElementById("feStepConfirm").style.display !== "block") return;
            if (e.target && e.target.tagName === "BUTTON") return;
            e.preventDefault();
            handleFeConfirm();
        });

        // Live selection updates from whichever page opened this dialog. Only acted on
        // while still on the "pick" step -- once a project's been picked (or filing has
        // started), changing the background selection shouldn't retroactively change what
        // this dialog is about to file, same guard the old inline version used.
        if (Office.context.ui && Office.context.ui.addHandlerAsync) {
            Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, (arg) => {
                if (document.getElementById("feStepPick").style.display !== "block") return;
                try {
                    const context = JSON.parse(arg.message);
                    feState.mode = context.mode || "none";
                    feState.items = context.items || [];
                    renderFeContext();
                } catch (err) {
                    console.error("Malformed selection update from opener:", err);
                }
            });
        }

        msalInstance = new msal.PublicClientApplication(msalConfig);
        attemptSilentSignIn();
    });

    function showApp(show) {
        document.getElementById("appBody").style.display = show ? "block" : "none";
        document.getElementById("signInPrompt").style.display = show ? "none" : "block";
    }

    async function signInAndGetToken(request, isUserAction) {
        const account = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0];
        if (account) {
            try {
                const silentResponse = await msalInstance.acquireTokenSilent({ ...request, account });
                return silentResponse.accessToken;
            } catch (error) {
                if (error instanceof msal.InteractionRequiredAuthError && isUserAction) {
                    const interactiveResponse = await msalInstance.acquireTokenPopup(request);
                    return interactiveResponse.accessToken;
                }
                throw error;
            }
        }
        if (isUserAction) {
            const loginResponse = await msalInstance.loginPopup(request);
            msalInstance.setActiveAccount(loginResponse.account);
            return loginResponse.accessToken;
        }
        return null;
    }

    async function handleLogin() {
        try {
            const loginResponse = await msalInstance.loginPopup(graphRequest);
            msalInstance.setActiveAccount(loginResponse.account);
            showApp(true);
            renderFeContext();
            renderFePendingBatches();
        } catch (err) {
            console.error("Sign in failed:", err);
        }
    }

    async function attemptSilentSignIn() {
        try {
            const token = await signInAndGetToken(graphRequest, false);
            if (token) {
                showApp(true);
                renderFeContext();
                renderFePendingBatches();
            } else {
                showApp(false);
            }
        } catch (err) {
            showApp(false);
        }
    }

    // ---- Generic Graph/SharePoint helpers (ported from taskpane.html/complete-action.html) ----

    function encodePath(path) {
        return path.split("/").map(encodeURIComponent).join("/");
    }

    async function graphGet(url, token) {
        const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Graph API error: ${response.status} ${response.statusText} - ${errorText}`);
        }
        return response.json();
    }

    async function graphGetOrNull(url, token) {
        const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
        if (response.status === 404) return null;
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Graph API error: ${response.status} ${response.statusText} - ${errorText}`);
        }
        return response.json();
    }

    async function listFolders(driveId, path, token) {
        const data = await graphGetOrNull(
            `https://graph.microsoft.com/v1.0/drives/${driveId}/root:/${encodePath(path)}:/children?$select=name,folder&$top=999`,
            token
        );
        if (!data) return [];
        return (data.value || []).filter(entry => entry.folder);
    }

    function extractProjectNumber(name) {
        const match = /^[a-zA-Z]{5}(\d{5})[_-]/.exec(name || "");
        return match ? parseInt(match[1], 10) : -Infinity;
    }

    function serviceFilterMatches(selectedService, combo) {
        if (selectedService === "Energy") return combo.startsWith("EN");
        if (selectedService === "Sustainability") return combo.startsWith("SU");
        return !combo.startsWith("EN") && !combo.startsWith("SU");
    }

    // ---- Context / step rendering ----

    function showFeStep(step) {
        document.getElementById("feStepPick").style.display = step === "pick" ? "block" : "none";
        document.getElementById("feStepConfirm").style.display = step === "confirm" ? "block" : "none";
        document.getElementById("feStepResult").style.display = step === "result" ? "block" : "none";
    }

    let hasFocusedFilterBox = false;

    function renderFeContext() {
        const summary = document.getElementById("feContextSummary");
        const noSelection = document.getElementById("feNoSelection");
        const pickBody = document.getElementById("fePickBody");
        summary.innerHTML = "";

        if (!feState.items || feState.items.length === 0) {
            noSelection.style.display = "block";
            pickBody.style.display = "none";
            return;
        }

        const count = feState.items.length;
        const text = count > 1
            ? `Categorizing ${count} selected email(s).`
            : `Categorizing 1 email: "${feState.items[0].subject}"`;
        const box = document.createElement("div");
        box.className = "summary-box";
        const row = document.createElement("div");
        row.className = "row";
        row.textContent = text;
        box.appendChild(row);
        summary.appendChild(box);

        noSelection.style.display = "none";
        pickBody.style.display = "block";
        if (feFolderEntries.length === 0) {
            loadFeFolderNames();
        } else {
            renderFeFolderList(document.getElementById("feFilterBox").value);
        }
        // Only steal focus the first time this shows the picker (dialog open, or a live
        // selection update arriving while "no selection" was showing) -- not on every
        // subsequent live update, which would otherwise yank focus away from someone
        // already typing in the filter box or about to click a result.
        if (!hasFocusedFilterBox) {
            hasFocusedFilterBox = true;
            focusWhenReady("feFilterBox");
        }
    }

    // Dialogs are expected to get real OS focus from the host on creation, which is the
    // whole reason this is a dialog now -- but keep the same retrying focus helper rather
    // than a single .focus() call, since there's no live Outlook test confirming the exact
    // timing here either.
    function focusWhenReady(elementId) {
        const el = document.getElementById(elementId);
        if (!el) return;
        let done = false;

        function tryFocus() {
            if (done || el.offsetParent === null) return;
            try { window.focus(); } catch (err) { /* ignore */ }
            el.focus();
            if (document.activeElement === el) {
                done = true;
                cleanup();
            }
        }
        function cleanup() {
            clearInterval(poll);
            window.removeEventListener("focus", tryFocus);
            document.removeEventListener("visibilitychange", tryFocus);
        }

        const poll = setInterval(tryFocus, 150);
        window.addEventListener("focus", tryFocus);
        document.addEventListener("visibilitychange", tryFocus);
        tryFocus();
        setTimeout(cleanup, 15000);
    }

    function resetToPick() {
        showFeStep("pick");
        document.getElementById("feFilterBox").value = "";
        document.getElementById("feSetupStatus").textContent = "";
        renderFeContext();
    }

    let feFolderEntries = [];

    async function loadFeFolderNames() {
        const status = document.getElementById("feSetupStatus");
        status.style.color = "#333";
        status.textContent = "Loading Archive & Active project folders...";
        try {
            const token = await signInAndGetToken(sitesRequest, true);
            if (!token) throw new Error("Could not get permission to access SharePoint.");

            const archiveCombos = Object.keys(ARCHIVE_BRANCH_PATH);
            const activeCombos = Object.keys(ACTIVE_BRANCH_PATH);
            const [archiveResults, activeResults] = await Promise.all([
                Promise.all(archiveCombos.map(async combo => {
                    const folders = await listFolders(ARCHIVE_DRIVE_ID, ARCHIVE_BRANCH_PATH[combo], token);
                    return folders.filter(f => !/template/i.test(f.name)).map(f => ({ name: f.name, combo, source: "Archive" }));
                })),
                Promise.all(activeCombos.map(async combo => {
                    const folders = await listFolders(ACTIVE_DRIVE_ID, ACTIVE_BRANCH_PATH[combo], token);
                    return folders.filter(f => !/template/i.test(f.name)).map(f => ({ name: f.name, combo, source: "Active" }));
                }))
            ]);

            feFolderEntries = [...archiveResults.flat(), ...activeResults.flat()];
            renderFeFolderList(document.getElementById("feFilterBox").value);
            status.textContent = "";
        } catch (err) {
            console.error("Failed to load Archive/Active project folders:", err);
            status.textContent = `Error: ${err.message}`;
            status.style.color = "red";
        }
    }

    function refreshFeFolderList() {
        const btn = document.getElementById("feRefreshListButton");
        btn.classList.add("spinning");
        loadFeFolderNames().finally(() => {
            setTimeout(() => btn.classList.remove("spinning"), 400);
            document.getElementById("feSetupStatus").textContent = "Updated just now.";
        });
    }

    // Tracks whatever renderFeFolderList most recently rendered, so the filter box's
    // keyboard handler (arrows/Enter) can navigate and select without re-deriving the
    // filtered list itself.
    let feFilteredEntries = [];
    let feHighlightIndex = -1;

    function renderFeFolderList(filter) {
        const list = document.getElementById("feFolderList");
        list.innerHTML = "";
        const selectedService = document.querySelector('input[name="feService"]:checked').value;
        const normalizedFilter = (filter || "").toLowerCase();
        feFilteredEntries = feFolderEntries
            .filter(entry => serviceFilterMatches(selectedService, entry.combo))
            .filter(entry => entry.name.toLowerCase().includes(normalizedFilter))
            .sort((a, b) => extractProjectNumber(b.name) - extractProjectNumber(a.name));
        feHighlightIndex = feFilteredEntries.length > 0 ? 0 : -1;

        if (feFilteredEntries.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty-message";
            empty.textContent = "No matching project folders found.";
            list.appendChild(empty);
            return;
        }

        feFilteredEntries.forEach((entry, index) => {
            const item = document.createElement("div");
            item.className = "folder-item" + (index === feHighlightIndex ? " selected" : "");

            const name = document.createElement("span");
            name.className = "name";
            name.textContent = entry.name;
            item.appendChild(name);

            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = `${entry.combo} · ${entry.source}`;
            item.appendChild(tag);

            item.addEventListener("click", () => selectFeProject(entry.name));
            item.addEventListener("mouseenter", () => setFeHighlight(index));
            list.appendChild(item);
        });
    }

    function setFeHighlight(index) {
        const items = document.getElementById("feFolderList").querySelectorAll(".folder-item");
        if (feHighlightIndex >= 0 && items[feHighlightIndex]) items[feHighlightIndex].classList.remove("selected");
        feHighlightIndex = index;
        const highlighted = items[feHighlightIndex];
        if (highlighted) {
            highlighted.classList.add("selected");
            highlighted.scrollIntoView({ block: "nearest" });
        }
    }

    function handleFeFilterKeydown(e) {
        if (feFilteredEntries.length === 0) return;
        if (e.key === "ArrowDown") {
            e.preventDefault();
            setFeHighlight(Math.min(feHighlightIndex + 1, feFilteredEntries.length - 1));
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            setFeHighlight(Math.max(feHighlightIndex - 1, 0));
        } else if (e.key === "Enter") {
            e.preventDefault();
            // Also stop this exact keydown from bubbling to the document-level Enter
            // handler below -- selectFeProject synchronously shows stepConfirm and moves
            // focus to feConfirmButton, all within this same event, and the bubbling
            // listener was then seeing "Enter pressed while stepConfirm is visible" and
            // immediately confirming, auto-skipping the Confirm screen entirely before the
            // user ever saw it. e.target is still this filter box throughout the bubble
            // (it doesn't follow the focus change), so the listener's own BUTTON check
            // never caught this.
            e.stopPropagation();
            if (feHighlightIndex >= 0 && feFilteredEntries[feHighlightIndex]) {
                selectFeProject(feFilteredEntries[feHighlightIndex].name);
            }
        }
    }

    function selectFeProject(name) {
        feState.projectName = name;
        const count = feState.items.length;
        document.getElementById("feConfirmSummary").innerHTML = `
            <div class="summary-box">
                <div class="row"><span class="label">Project:</span> ${name}</div>
                <div class="row">${count} item(s) will be categorized as "${name}" and moved into "Emails to File".</div>
            </div>
        `;
        showFeStep("confirm");
        // Focused (not just reachable via the document-level Enter handler above) so it's
        // visibly the default action, and Tab/Shift+Tab work normally from here too.
        document.getElementById("feConfirmButton").focus();
    }

    // Bounded safety net, added 2026-10-07 after a live incident: acquireTokenSilent can
    // hang instead of throwing when its hidden-iframe navigation to login.microsoftonline.com
    // is blocked (missing AppDomains entry -- same root cause as the File on Send incident
    // the same day, fixed in manifest2.xml but slow to propagate). The Confirm step's two
    // pre-flight calls below request a scope (mailWriteRequest) not used anywhere earlier in
    // this dialog, so they're the first to need a *silent* token for it each session -- that
    // hang left this dialog stuck on "Starting..." forever instead of closing. Both already
    // have a sensible fallback in their own catch block; they just need a way to actually
    // reach it instead of hanging.
    function withTimeout(promise, ms, label) {
        return Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} timed out after ${ms}ms`)), ms))
        ]);
    }

    // Looks up a category by display name in the mailbox's master list. Returns null if
    // it isn't there, so the caller can tell "never existed" apart from "exists."
    async function findMasterCategory(categoryName) {
        const token = await signInAndGetToken(mailWriteRequest, true);
        if (!token) throw new Error("Could not get permission to read mailbox categories.");
        const result = await graphGet("https://graph.microsoft.com/v1.0/me/outlook/masterCategories", token);
        return (result.value || []).find(c => c.displayName === categoryName) || null;
    }

    async function deleteMasterCategory(categoryId) {
        const token = await signInAndGetToken(mailWriteRequest, true);
        if (!token) throw new Error("Could not get permission to clean up mailbox categories.");
        const response = await fetch(`https://graph.microsoft.com/v1.0/me/outlook/masterCategories/${encodeURIComponent(categoryId)}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${token}` }
        });
        if (!response.ok && response.status !== 404) {
            const errorText = await response.text();
            throw new Error(`Could not remove master category: ${response.status} ${errorText}`);
        }
    }

    let feEmailsToFileFolderId = null;

    async function getOrCreateEmailsToFileFolderId() {
        if (feEmailsToFileFolderId) return feEmailsToFileFolderId;
        const token = await signInAndGetToken(mailWriteRequest, true);
        if (!token) throw new Error("Could not get permission to access your mailbox.");

        const existing = await graphGet(
            `https://graph.microsoft.com/v1.0/me/mailFolders/inbox/childFolders?$filter=${encodeURIComponent("displayName eq 'Emails to File'")}`,
            token
        );
        if (existing.value && existing.value.length > 0) {
            feEmailsToFileFolderId = existing.value[0].id;
            return feEmailsToFileFolderId;
        }

        const response = await fetch("https://graph.microsoft.com/v1.0/me/mailFolders/inbox/childFolders", {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ displayName: "Emails to File" })
        });
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Could not create "Emails to File": ${response.status} ${errorText}`);
        }
        const created = await response.json();
        feEmailsToFileFolderId = created.id;
        return feEmailsToFileFolderId;
    }

    // ---- Server-side batch handoff ----
    // The actual categorize+move loop runs on the Exchange bridge (FileEmailBatch), not
    // here -- once the bridge receives this request, Azure Functions keeps running it to
    // completion even if this dialog is closed moments later. batchId is tracked in
    // localStorage the moment the batch is sent, not after it completes, so if this window
    // is closed before the response lands, the next time File Email is opened (from either
    // entry point -- this localStorage is shared with taskpane.html) it can still check
    // what actually happened.

    const FE_BATCHES_STORAGE_KEY = "fileEmailPendingBatches";

    function getFeBatchesFromStorage() {
        try {
            return JSON.parse(localStorage.getItem(FE_BATCHES_STORAGE_KEY) || "[]");
        } catch (err) {
            return [];
        }
    }

    function saveFeBatchesToStorage(batches) {
        try {
            localStorage.setItem(FE_BATCHES_STORAGE_KEY, JSON.stringify(batches));
        } catch (err) {
            console.error("Could not persist File Email batch tracking:", err);
        }
    }

    function addFeBatchToStorage(entry) {
        const batches = getFeBatchesFromStorage();
        batches.push(entry);
        saveFeBatchesToStorage(batches);
    }

    function removeFeBatchFromStorage(batchId) {
        saveFeBatchesToStorage(getFeBatchesFromStorage().filter(b => b.batchId !== batchId));
    }

    async function getFeBatchStatus(batchId) {
        const token = await signInAndGetToken(bridgeRequest, true);
        if (!token) throw new Error("Could not get permission to call the bridge.");
        const response = await fetch(`${BRIDGE_URL}/api/file-email-batch/${encodeURIComponent(batchId)}`, {
            headers: { Authorization: `Bearer ${token}` }
        });
        if (response.status === 404) return null;
        if (!response.ok) throw new Error(`Status check failed: ${response.status}`);
        return response.json();
    }

    function feTimeAgo(isoString) {
        const minutes = Math.round((Date.now() - new Date(isoString).getTime()) / 60000);
        if (minutes < 1) return "just now";
        if (minutes === 1) return "1 minute ago";
        return `${minutes} minutes ago`;
    }

    const FE_BATCH_STALE_MS = 3 * 60 * 1000;
    const FE_BATCH_MAX_RETRIES = 2;

    async function postFeBatch(entry, signal) {
        // Same withTimeout treatment as the Confirm step's pre-flight checks, and for the
        // same reason -- bridgeRequest in particular is never requested anywhere else in
        // this dialog, so this can be the first thing needing a silent token for it. This
        // call happens upstream of the fetch() below, so the AbortController passed in as
        // `signal` can't reach a hang here at all -- it's only wired to that fetch. Timing
        // this out at least lets this promise settle (so the fire-and-forget .catch above
        // actually runs) instead of leaving it dangling forever; it does NOT guarantee the
        // dialog window itself can still close promptly, if the host is the one holding it
        // open pending that navigation.
        const graphToken = await withTimeout(signInAndGetToken(mailWriteRequest, true), 8000, "signInAndGetToken(mailWriteRequest)");
        if (!graphToken) throw new Error("Could not get permission to categorize/move emails.");
        const bridgeToken = await withTimeout(signInAndGetToken(bridgeRequest, true), 8000, "signInAndGetToken(bridgeRequest)");
        if (!bridgeToken) throw new Error("Could not get permission to call the bridge.");

        const response = await fetch(`${BRIDGE_URL}/api/file-email-batch/${entry.batchId}`, {
            method: "POST",
            headers: { Authorization: `Bearer ${bridgeToken}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                graphAccessToken: graphToken,
                categoryName: entry.categoryName,
                destinationFolderId: entry.destinationFolderId,
                items: entry.items
            }),
            signal
        });
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Bridge returned ${response.status}: ${errorText}`);
        }
        return response.json();
    }

    function describeFeItemError(errorText) {
        if (!errorText) return "unknown error";
        if (/ErrorItemNotFound|ErrorInvalidIdMalformed|does not exist|\(404\)|404 \(Not Found\)/i.test(errorText)) {
            return "this email appears to have been moved or deleted since filing was started";
        }
        return errorText;
    }

    async function finalizeFeBatchResult(entry, result) {
        let cleanupNote = "";
        if (entry.categoryPreExisted) {
            cleanupNote = ` "${entry.categoryName}" was already in your category list before this run, so it was left as-is.`;
        } else if (result.succeeded > 0) {
            try {
                const masterEntry = await findMasterCategory(entry.categoryName);
                if (masterEntry) {
                    await deleteMasterCategory(masterEntry.id);
                    cleanupNote = ` Removed "${entry.categoryName}" from your category list (it didn't exist before this run).`;
                }
            } catch (err) {
                console.error("Could not clean up the auto-created master category:", err);
                cleanupNote = ` Note: "${entry.categoryName}" is now in your category list and couldn't be automatically removed (${err.message}).`;
            }
        }

        const failureDetails = (result.items || [])
            .filter(i => i.status === "failed")
            .map(i => `"${i.subject}" — ${describeFeItemError(i.error)}`);

        return { cleanupNote, failureDetails };
    }

    async function refreshPendingFeBatches() {
        const batches = getFeBatchesFromStorage();
        if (batches.length === 0) return [];

        const stillPending = [];
        const notes = [];
        for (const entry of batches) {
            let result;
            try {
                result = await getFeBatchStatus(entry.batchId);
            } catch (err) {
                console.error("Could not check File Email batch status:", err);
                stillPending.push(entry);
                notes.push({ batchId: entry.batchId, text: `"${entry.categoryName}": couldn't check its status just now (started ${feTimeAgo(entry.startedAt)}).` });
                continue;
            }

            if (result && result.status === "done") {
                if (result.failed > 0) {
                    const { cleanupNote, failureDetails } = await finalizeFeBatchResult(entry, result);
                    const failureNote = failureDetails.length ? ` ${failureDetails.join("; ")}.` : "";
                    notes.push({ batchId: entry.batchId, text: `"${entry.categoryName}": ${result.succeeded} of ${result.total} categorized and moved, ${result.failed} failed.${failureNote}${cleanupNote}` });
                } else {
                    await finalizeFeBatchResult(entry, result);
                }
                continue;
            }

            const elapsed = Date.now() - new Date(entry.lastAttemptAt || entry.startedAt).getTime();
            if (elapsed < FE_BATCH_STALE_MS) {
                stillPending.push(entry);
                notes.push({ batchId: entry.batchId, text: `"${entry.categoryName}": still processing (started ${feTimeAgo(entry.startedAt)}).` });
                continue;
            }

            if ((entry.retryCount || 0) >= FE_BATCH_MAX_RETRIES) {
                notes.push({
                    batchId: entry.batchId,
                    text: `"${entry.categoryName}": no confirmation came back after ${entry.retryCount} automatic retr${entry.retryCount === 1 ? "y" : "ies"} (started ${feTimeAgo(entry.startedAt)}). It may well have already gone through — check the email's folder/category (or Email Search) before re-filing it, so it isn't filed twice.`
                });
                continue;
            }

            const retried = { ...entry, lastAttemptAt: new Date().toISOString(), retryCount: (entry.retryCount || 0) + 1 };
            try {
                const result2 = await postFeBatch(retried);
                const { cleanupNote, failureDetails } = await finalizeFeBatchResult(retried, result2);
                const failureNote = failureDetails.length ? ` ${failureDetails.join("; ")}.` : "";
                notes.push({ batchId: entry.batchId, text: `"${entry.categoryName}": took longer than expected, so it was automatically retried — ${result2.succeeded} of ${result2.total} succeeded, ${result2.failed} failed.${failureNote}${cleanupNote}` });
            } catch (err) {
                console.error("Automatic retry of a File Email batch failed:", err);
                stillPending.push(retried);
                notes.push({ batchId: entry.batchId, text: `"${entry.categoryName}": took longer than expected, and an automatic retry (attempt ${retried.retryCount}) didn't get a confirmed result either (${err.message}). Will try again.` });
            }
        }
        saveFeBatchesToStorage(stillPending);
        return notes;
    }

    async function renderFePendingBatches() {
        const container = document.getElementById("fePendingBatches");
        container.innerHTML = "";
        try {
            const notes = await refreshPendingFeBatches();
            if (notes.length === 0) return;

            const box = document.createElement("div");
            box.className = "warning-box";
            const heading = document.createElement("b");
            heading.textContent = "Recent File Email batches:";
            box.appendChild(heading);

            notes.forEach(note => {
                const row = document.createElement("div");
                row.style.marginTop = "6px";
                const text = document.createElement("span");
                text.textContent = note.text;
                row.appendChild(text);

                const dismiss = document.createElement("a");
                dismiss.href = "#";
                dismiss.textContent = "Dismiss";
                dismiss.style.marginLeft = "8px";
                dismiss.style.fontSize = "11px";
                dismiss.style.whiteSpace = "nowrap";
                dismiss.addEventListener("click", (e) => {
                    e.preventDefault();
                    removeFeBatchFromStorage(note.batchId);
                    row.remove();
                    if (!box.querySelector("div")) container.innerHTML = "";
                });
                row.appendChild(dismiss);
                box.appendChild(row);
            });

            container.appendChild(box);
        } catch (err) {
            console.error("Could not refresh pending File Email batches:", err);
        }
    }

    function handleFeConfirm() {
        return guardAgainstClose(handleFeConfirmInner);
    }

    async function handleFeConfirmInner() {
        const categoryName = feState.projectName;
        const resultSummary = document.getElementById("feResultSummary");
        resultSummary.innerHTML = `<div class="summary-box"><div class="row">Starting...</div></div>`;
        showFeStep("result");

        let categoryPreExisted = true;
        try {
            categoryPreExisted = (await withTimeout(findMasterCategory(categoryName), 8000, "findMasterCategory")) !== null;
        } catch (err) {
            console.error("Could not check master category list beforehand:", err);
            categoryPreExisted = true;
        }

        let emailsToFileFolderId = null;
        try {
            emailsToFileFolderId = await withTimeout(getOrCreateEmailsToFileFolderId(), 8000, "getOrCreateEmailsToFileFolderId");
        } catch (err) {
            console.error("Could not resolve the Emails to File folder:", err);
        }

        const batchId = crypto.randomUUID();
        // feState.items already carry restId -- converted by whoever opened this dialog
        // (Office.context.mailbox.convertToRestId isn't available in here at all).
        const items = feState.items.map(item => ({ restId: item.restId, subject: item.subject }));

        const now = new Date().toISOString();
        const batchEntry = {
            batchId, categoryName, total: items.length,
            startedAt: now, lastAttemptAt: now, retryCount: 0,
            items, destinationFolderId: emailsToFileFolderId, categoryPreExisted
        };
        addFeBatchToStorage(batchEntry);

        // Fire the actual categorize+move request, but don't make the user wait here for
        // it to finish -- the bridge keeps it running to completion on its own regardless
        // of whether this dialog is even still open (see postFeBatch's own comment), and
        // the batch is already durably tracked in localStorage just above. Whatever
        // happens (success, failure, or no response at all) gets reported the next time
        // any File Email dialog opens, via the pending-batch check -- same mechanism
        // that's always covered the "dialog closed before the response landed" case, now
        // just deliberately used every time instead of only when it happens by accident.
        //
        // Deliberately abort our own fetch before closing (see below) rather than just
        // leaving it unawaited: some Outlook hosts hold the dialog window open until its
        // outstanding network requests settle, even after closeContainer()/window.close()
        // is called -- confirmed, this dialog was still sitting there until the whole
        // categorize+move round trip finished. Aborting the *client's* fetch doesn't
        // affect the request already received by the bridge -- that keeps running
        // server-side regardless, same as always.
        const abortController = new AbortController();
        postFeBatch(batchEntry, abortController.signal)
            .then((result) => {
                removeFeBatchFromStorage(batchId);
                return finalizeFeBatchResult(batchEntry, result);
            })
            .catch((err) => {
                if (err.name !== "AbortError") {
                    console.error("File Email batch failed after this dialog moved on:", err);
                }
            });

        resultSummary.innerHTML = `<div class="summary-box"><div class="row">Filing "${categoryName}" — continuing in the background.</div></div>`;
        document.getElementById("feStartOverButton").style.display = "none";
        document.getElementById("feCloseButton").style.display = "none";
        setTimeout(() => {
            abortController.abort();
            try { Office.context.ui.closeContainer(); } catch (err) { window.close(); }
        }, 500);
    }
  </script>
</body>
</html>
