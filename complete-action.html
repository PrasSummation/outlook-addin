<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Completing Your Request</title>
  <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
  <style>
    :root{
      --green:#408F4E; --green-dark:#2D6B38; --green-pale:#EDF7EE;
      --grey-900:#2B2B2B; --grey-600:#646464; --grey-400:#909090;
      --grey-500:#787878; --grey-300:#B4B4B4; --grey-200:#DCDCDC; --grey-100:#EFEFEF; --grey-50:#F7F7F7;
      --font-display:'Bahnschrift','DIN Alternate','Segoe UI',sans-serif;
      --font-body:'Calibri','Segoe UI',system-ui,sans-serif;
      --font-mono:'Consolas','Courier New',monospace;
    }
    *{box-sizing:border-box}
    body{margin:0;padding:0;background:#fff;font-family:var(--font-body);
         font-size:14px;line-height:1.5;color:var(--grey-600);-webkit-font-smoothing:antialiased}
    a{color:var(--green-dark);text-decoration:none}
    a:hover{color:var(--green);text-decoration:underline}

    #brandBar{background:var(--grey-900);padding:16px 28px;display:flex;align-items:center;gap:12px}
    #brandBar img{width:32px;height:32px}
    #brandBar .word{font-family:var(--font-display);font-size:15px;font-weight:600;color:#fff;letter-spacing:.14em}
    #brandBar .sub{font-size:11px;color:var(--grey-400);letter-spacing:.05em}

    #signInPrompt{padding:80px 24px;text-align:center}
    #signInPrompt p{margin:0 0 20px;font-size:14px;color:var(--grey-600)}
    #signInButton{padding:10px 24px;font:600 14px var(--font-body);color:#fff;background:var(--green);
      border:1px solid var(--green);border-radius:4px;cursor:pointer}
    #signInButton:hover{background:var(--green-dark)}

    #appBody{max-width:760px;margin:0 auto;padding:28px}
    .page-header h1{font-family:var(--font-display);font-size:20px;color:var(--grey-900);margin:0 0 4px}
    .page-header p{margin:0 0 20px;font-size:13px;color:var(--grey-500)}

    #status{font-size:13px;color:var(--grey-600);white-space:pre-wrap;margin-bottom:14px;min-height:1.4em}
    #status.error{color:#B3261E}

    .summary-box{border:1px solid var(--grey-200);border-radius:10px;padding:14px;
      font-size:13px;margin-bottom:14px;background:#fff}
    .summary-box .row{margin-bottom:6px}
    .summary-box .row:last-child{margin-bottom:0}
    .summary-box .label{font-weight:600;color:var(--grey-900)}
    .warning-box{border:1px solid #E78707;background:#FFF8E1;color:#7A5B00;border-radius:4px;
      padding:10px;font-size:12.5px;margin-bottom:10px}

    #stopRetryButton{padding:8px 16px;font:600 12.5px var(--font-body);color:#fff;background:var(--grey-500);
      border:1px solid var(--grey-500);border-radius:4px;cursor:pointer;margin-bottom:14px;display:none}
    #stopRetryButton:hover{opacity:.9}
    .small-button{padding:5px 10px;font-size:11px;color:#fff;background:var(--green);
      border:1px solid var(--green);border-radius:4px;cursor:pointer;display:inline-block}
    .small-button:hover{background:var(--green-dark)}
  </style>
</head>
<body>
  <div id="brandBar">
    <img src="https://prassummation.github.io/outlook-addin/logo-symbol-32x32.png" alt="Summation" />
    <div>
      <div class="word">SUMMATION</div>
      <div class="sub">Completing Your Request</div>
    </div>
  </div>

  <div id="signInPrompt">
    <p>Please sign in to continue.</p>
    <button id="signInButton">Sign In</button>
  </div>

  <div id="appBody" style="display:none;">
    <div class="page-header">
      <h1>Completing Your Request</h1>
      <p>This continues an action started from the Summation Assistant sidebar — safe to leave this tab running in the background, and safe to close the sidebar now.</p>
    </div>
    <div id="status">Looking for a pending action...</div>
    <button id="stopRetryButton" title="Show the result now with whatever access grants have succeeded so far; any still failing can be retried later via Manage Shared Mailbox Members.">Stop Waiting</button>
    <div id="resultSummary"></div>
  </div>

  <script>
    const BRIDGE_URL = "https://summation-exchange-bridge-e6e5gsendkdxdwf5.australiaeast-01.azurewebsites.net";
    const ACTIVE_DRIVE_ID = "b!6LWosCcMRkupf-n3ZowwIVyhngMkW-pOtIqfTmHpQ5wp-OK02_E3RbZkRH_jE_Lr";
    const ARCHIVE_DRIVE_ID = "b!6LWosCcMRkupf-n3ZowwIVyhngMkW-pOtIqfTmHpQ5zGiD4R7k2PQZMwL6mUreXS";
    const TEMPLATE_PATH = "Sustainability/Perth/SUPER00000_Project_Template";
    const ACTIVE_BRANCH_PATH = {
        SUPER: "Sustainability/Perth", SUADL: "Sustainability/Adelaide",
        ENPER: "Energy/Perth", ENADL: "Energy/Adelaide"
    };
    const ARCHIVE_BRANCH_PATH = {
        SUPER: "Sustainability/Perth", SUADL: "Sustainability/Archived_Adelaide",
        ENPER: "Energy/Perth", ENADL: "Energy/Adelaide"
    };

    const msalConfig = {
      auth: {
        clientId: "80497ed0-ecd5-475e-97e0-5c9e90fb8a0d",
        authority: "https://login.microsoftonline.com/ecb5f458-9548-4e8b-96f3-904f1828f931",
        redirectUri: window.location.origin + window.location.pathname
      },
      cache: { cacheLocation: "localStorage", storeAuthStateInCookie: false }
    };

    const graphRequest = { scopes: ["User.Read", "Mail.Read", "Directory.Read.All"] };
    const bridgeRequest = { scopes: ["api://80497ed0-ecd5-475e-97e0-5c9e90fb8a0d/MailboxBridge.Call"] };
    const sitesRequest = { scopes: ["Sites.Selected"] };

    let msalInstance;

    // Closing this tab mid-action kills its JavaScript outright, the same as any webpage —
    // there's no way to keep it running after that. This at least warns with the browser's
    // native "leave site?" prompt while an action is in progress.
    let actionInProgress = false;
    window.addEventListener("beforeunload", (e) => {
        if (actionInProgress) {
            e.preventDefault();
            e.returnValue = "";
        }
    });

    // Read (and immediately scrub from the visible URL) the handoff payload before doing
    // anything else — sign-in doesn't navigate this window (loginPopup is a separate popup,
    // acquireTokenSilent uses a hidden iframe), so holding this in memory survives the wait.
    let pendingAction = null;
    (function captureHandoffFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get("action");
        if (!raw) return;
        try {
            pendingAction = JSON.parse(raw);
        } catch (err) {
            pendingAction = { parseError: "The link from the sidebar was malformed." };
        }
        history.replaceState(null, "", window.location.pathname);
    })();

    window.addEventListener("load", () => {
        document.getElementById("signInButton").addEventListener("click", handleLogin);
        msalInstance = new msal.PublicClientApplication(msalConfig);
        attemptSilentSignIn();
    });

    function showApp(show) {
        document.getElementById("appBody").style.display = show ? "block" : "none";
        document.getElementById("signInPrompt").style.display = show ? "none" : "block";
    }

    async function signInAndGetToken(request, isUserAction) {
        const account = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0];
        if (account) {
            try {
                const silentResponse = await msalInstance.acquireTokenSilent({ ...request, account });
                return silentResponse.accessToken;
            } catch (error) {
                if (error instanceof msal.InteractionRequiredAuthError && isUserAction) {
                    const interactiveResponse = await msalInstance.acquireTokenPopup(request);
                    return interactiveResponse.accessToken;
                }
                throw error;
            }
        }
        if (isUserAction) {
            const loginResponse = await msalInstance.loginPopup(request);
            msalInstance.setActiveAccount(loginResponse.account);
            return loginResponse.accessToken;
        }
        return null;
    }

    async function handleLogin() {
        try {
            const loginResponse = await msalInstance.loginPopup(graphRequest);
            msalInstance.setActiveAccount(loginResponse.account);
            await afterSignIn();
        } catch (err) {
            updateStatus(`Sign in failed: ${err.message}`, true);
        }
    }

    async function attemptSilentSignIn() {
        try {
            const token = await signInAndGetToken(graphRequest, false);
            if (token) await afterSignIn();
            else showApp(false);
        } catch (err) {
            showApp(false);
        }
    }

    async function afterSignIn() {
        showApp(true);
        await runPendingAction();
    }

    function updateStatus(message, isError) {
        const el = document.getElementById("status");
        el.textContent = message;
        el.className = isError ? "error" : "";
    }

    // ---- Generic Graph/SharePoint helpers (ported from taskpane.html) ----

    async function graphGet(url, token) {
        const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Graph API error: ${response.status} ${response.statusText} - ${errorText}`);
        }
        return response.json();
    }

    async function graphGetAll(url, token) {
        let results = [];
        let nextUrl = url;
        while (nextUrl) {
            const data = await graphGet(nextUrl, token);
            results = results.concat(data.value);
            nextUrl = data["@odata.nextLink"] || null;
        }
        return results;
    }

    async function graphGetOrNull(url, token) {
        const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
        if (response.status === 404) return null;
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Graph API error: ${response.status} ${response.statusText} - ${errorText}`);
        }
        return response.json();
    }

    function encodePath(path) {
        return path.split("/").map(encodeURIComponent).join("/");
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function base64ToBytes(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    function sanitizeFileName(name) {
        return (name || "").replace(/[\\/:*?"<>|]/g, "").trim() || "file";
    }

    async function listFolders(driveId, path, token) {
        const data = await graphGetOrNull(
            `https://graph.microsoft.com/v1.0/drives/${driveId}/root:/${encodePath(path)}:/children?$select=name,folder&$top=999`,
            token
        );
        if (!data) return [];
        return (data.value || []).filter(entry => entry.folder);
    }

    // Next number for a combo+year = (highest NNN used anywhere for that combo+year,
    // across BOTH libraries) + 1. Templates are excluded by name, not by hardcoded number.
    async function getNextProjectNumber(token, combo) {
        const yy = String(new Date().getFullYear() % 100).padStart(2, "0");
        const [activeFolders, archiveFolders] = await Promise.all([
            listFolders(ACTIVE_DRIVE_ID, ACTIVE_BRANCH_PATH[combo], token),
            listFolders(ARCHIVE_DRIVE_ID, ARCHIVE_BRANCH_PATH[combo], token)
        ]);

        const codePattern = new RegExp(`^${combo}(\\d{2})(\\d{3})`, "i");
        let maxNNN = 0;
        [...activeFolders, ...archiveFolders].forEach(folder => {
            if (/template/i.test(folder.name)) return;
            const match = folder.name.match(codePattern);
            if (!match || match[1] !== yy) return;
            const nnn = parseInt(match[2], 10);
            if (nnn > maxNNN) maxNNN = nnn;
        });

        return { yy, nextNNN: maxNNN + 1 };
    }

    async function createFolder(driveId, parentId, name, token) {
        const createUrl = parentId
            ? `https://graph.microsoft.com/v1.0/drives/${driveId}/items/${parentId}/children`
            : `https://graph.microsoft.com/v1.0/drives/${driveId}/root/children`;
        const response = await fetch(createUrl, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ name, folder: {}, "@microsoft.graph.conflictBehavior": "fail" })
        });
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Failed to create folder "${name}": ${response.status} - ${errorText}`);
        }
        return response.json();
    }

    async function getOrCreateBranchFolder(driveId, path, token) {
        const existing = await graphGetOrNull(`https://graph.microsoft.com/v1.0/drives/${driveId}/root:/${encodePath(path)}`, token);
        if (existing) return existing.id;

        const segments = path.split("/");
        let parentId = null;
        let builtPath = "";
        for (const segment of segments) {
            builtPath = builtPath ? `${builtPath}/${segment}` : segment;
            let folder = await graphGetOrNull(`https://graph.microsoft.com/v1.0/drives/${driveId}/root:/${encodePath(builtPath)}`, token);
            if (!folder) folder = await createFolder(driveId, parentId, segment, token);
            parentId = folder.id;
        }
        return parentId;
    }

    async function pollCopyMonitor(monitorUrl) {
        if (!monitorUrl) return;
        for (let attempt = 0; attempt < 30; attempt++) {
            const resp = await fetch(monitorUrl);
            const data = await resp.json();
            if (data.status === "completed") return;
            if (data.status === "failed") throw new Error(`Copy failed: ${data.statusDescription || JSON.stringify(data)}`);
            await sleep(2000);
        }
        throw new Error("Copy is taking longer than expected — check the destination folder manually.");
    }

    async function copyTemplateFolder(archivePath, destParentId, newName, token) {
        const templateItem = await graphGetOrNull(
            `https://graph.microsoft.com/v1.0/drives/${ARCHIVE_DRIVE_ID}/root:/${encodePath(TEMPLATE_PATH)}`,
            token
        );
        if (!templateItem) throw new Error("Could not find the SUPER00000_Project_Template folder.");

        const response = await fetch(
            `https://graph.microsoft.com/v1.0/drives/${ARCHIVE_DRIVE_ID}/items/${templateItem.id}/copy`,
            {
                method: "POST",
                headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ parentReference: { driveId: ARCHIVE_DRIVE_ID, id: destParentId }, name: newName })
            }
        );
        if (response.status !== 202) {
            const errorText = await response.text();
            throw new Error(`Failed to start template copy: ${response.status} - ${errorText}`);
        }
        await pollCopyMonitor(response.headers.get("Location"));

        const newItem = await graphGetOrNull(
            `https://graph.microsoft.com/v1.0/drives/${ARCHIVE_DRIVE_ID}/root:/${encodePath(archivePath)}/${encodeURIComponent(newName)}`,
            token
        );
        if (!newItem) throw new Error("Template copy reported success, but the new folder could not be found.");
        return newItem;
    }

    async function copyFolderAcrossDrives(sourceDriveId, sourceItemId, destDriveId, destParentId, newName, token) {
        const response = await fetch(
            `https://graph.microsoft.com/v1.0/drives/${sourceDriveId}/items/${sourceItemId}/copy`,
            {
                method: "POST",
                headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ parentReference: { driveId: destDriveId, id: destParentId }, name: newName })
            }
        );
        if (response.status !== 202) {
            const errorText = await response.text();
            throw new Error(`Failed to start copy: ${response.status} - ${errorText}`);
        }
        await pollCopyMonitor(response.headers.get("Location"));
    }

    async function deleteItem(driveId, itemId, token) {
        const response = await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${token}` }
        });
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`${response.status} - ${errorText}`);
        }
    }

    async function uploadFileContent(driveId, parentId, filename, bytes, contentType, token) {
        if (bytes.byteLength > 4 * 1024 * 1024) {
            throw new Error(`"${filename}" is larger than 4MB — large-file upload isn't supported yet in this version.`);
        }
        const response = await fetch(
            `https://graph.microsoft.com/v1.0/drives/${driveId}/items/${parentId}:/${encodeURIComponent(filename)}:/content`,
            { method: "PUT", headers: { Authorization: `Bearer ${token}`, "Content-Type": contentType }, body: bytes }
        );
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Upload failed: ${response.status} - ${errorText}`);
        }
        return response.json();
    }

    async function copyLinkToClipboard(url, statusElementId) {
        const status = document.getElementById(statusElementId);
        try {
            await navigator.clipboard.writeText(url);
            if (status) status.textContent = "Copied!";
        } catch (err) {
            if (status) status.textContent = "Could not copy — select and copy the link manually.";
        }
    }

    // Filing "the email that was open" has to go through Graph rather than Office.js here —
    // this page has no Office.js context at all, unlike the taskpane. internetMessageId
    // (captured synchronously in the sidebar before handoff) is enough to look the same
    // message up via Graph and pull both its raw content and its attachments independently.
    async function fileEmailAndAttachmentsViaGraph(driveId, bdFolderId, internetMessageId, subject, token) {
        const results = { email: null, attachments: [], errors: [] };
        if (!internetMessageId) return results;

        let messageId;
        try {
            const mailToken = await signInAndGetToken(graphRequest, true);
            const findUrl = `https://graph.microsoft.com/v1.0/me/messages?$filter=internetMessageId eq '${encodeURIComponent(internetMessageId)}'&$select=id`;
            const findData = await graphGetOrNull(findUrl, mailToken);
            if (!findData || !findData.value || findData.value.length === 0) {
                results.errors.push("Could not find the original email in your mailbox (it may have been moved or deleted since).");
                return results;
            }
            messageId = findData.value[0].id;

            const emlResponse = await fetch(`https://graph.microsoft.com/v1.0/me/messages/${messageId}/$value`, {
                headers: { Authorization: `Bearer ${mailToken}` }
            });
            if (!emlResponse.ok) throw new Error(`Could not download email content: ${emlResponse.status}`);
            const emlBytes = await emlResponse.arrayBuffer();
            const filename = sanitizeFileName(`${subject || "email"}.eml`);
            await uploadFileContent(driveId, bdFolderId, filename, new Uint8Array(emlBytes), "message/rfc822", token);
            results.email = filename;
        } catch (err) {
            results.errors.push(`Email: ${err.message}`);
            return results;
        }

        try {
            const mailToken = await signInAndGetToken(graphRequest, true);
            const attachments = await graphGetAll(`https://graph.microsoft.com/v1.0/me/messages/${messageId}/attachments`, mailToken);
            for (const attachment of attachments.filter(a => !a.isInline)) {
                try {
                    if (!attachment.contentBytes) {
                        results.errors.push(`Attachment "${attachment.name}": not a plain file attachment (skipped).`);
                        continue;
                    }
                    const filename = sanitizeFileName(attachment.name);
                    await uploadFileContent(driveId, bdFolderId, filename, base64ToBytes(attachment.contentBytes), attachment.contentType || "application/octet-stream", token);
                    results.attachments.push(filename);
                } catch (err) {
                    results.errors.push(`Attachment "${attachment.name}": ${err.message}`);
                }
            }
        } catch (err) {
            results.errors.push(`Attachments: ${err.message}`);
        }

        return results;
    }

    // ---- Bridge / staff helpers (ported from taskpane.html) ----

    function deriveMailboxAddress(mailboxName) {
        return `${mailboxName.replace(/[^a-zA-Z0-9_]/g, '')}@summation.au`;
    }

    async function createSharedMailboxViaBridge(mailboxName, token) {
        const mailbox = deriveMailboxAddress(mailboxName);
        const response = await fetch(`${BRIDGE_URL}/api/shared-mailboxes`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ mailbox, displayName: mailboxName })
        });
        if (response.status === 409) {
            return { mailbox, alreadyExisted: true };
        }
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Bridge error: ${response.status} - ${errorText}`);
        }
        return { mailbox, alreadyExisted: false };
    }

    async function getAllStaffMembers(token) {
        const url = "https://graph.microsoft.com/v1.0/users?$select=displayName,mail,userPrincipalName,assignedLicenses,accountEnabled&$top=999";
        const users = await graphGetAll(url, token);
        const projectMailboxRegex = /^[a-zA-Z]{5}\d{5}[_-].*@summation\.au$/i;
        return users
            .filter(u => u.assignedLicenses.length > 0 && u.accountEnabled !== false)
            .map(u => ({ name: u.displayName, mail: u.mail || u.userPrincipalName }))
            .filter(u => u.mail && !projectMailboxRegex.test(u.mail));
    }

    async function getStaffByDepartments(departments, token) {
        const url = "https://graph.microsoft.com/v1.0/users?$select=displayName,mail,userPrincipalName,department,assignedLicenses,accountEnabled&$top=999";
        const users = await graphGetAll(url, token);
        const projectMailboxRegex = /^[a-zA-Z]{5}\d{5}[_-].*@summation\.au$/i;
        const wanted = new Set(departments.map(d => d.toLowerCase()));
        return users
            .filter(u => u.assignedLicenses.length > 0 && u.accountEnabled !== false)
            .map(u => ({ name: u.displayName, mail: u.mail || u.userPrincipalName, department: (u.department || "").trim() }))
            .filter(u => u.mail && !projectMailboxRegex.test(u.mail))
            .filter(u => wanted.has(u.department.toLowerCase()));
    }

    async function grantMailboxPermissionViaBridge(mailbox, user, token, autoMapping) {
        const response = await fetch(`${BRIDGE_URL}/api/mailbox-permissions/grant`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ mailbox, user, autoMapping })
        });
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Bridge error: ${response.status} - ${errorText}`);
        }
        return response.json();
    }

    function waitUnless(ms, isStopped) {
        return new Promise(resolve => {
            const start = Date.now();
            const interval = setInterval(() => {
                if (isStopped() || Date.now() - start >= ms) {
                    clearInterval(interval);
                    resolve();
                }
            }, 500);
        });
    }

    async function grantAccessToStaffWithRetry(mailbox, fetchStaff, label, statusEl, stopButton) {
        const result = { grants: [], grantsError: null, stoppedByUser: false, gaveUp: false };

        let stopRequested = false;
        const stopHandler = () => { stopRequested = true; };
        stopButton.addEventListener("click", stopHandler);
        stopButton.style.display = "inline-block";

        try {
            statusEl.textContent = `Looking up ${label}...`;
            const graphToken = await signInAndGetToken(graphRequest, true);
            const staff = await fetchStaff(graphToken);
            const bridgeToken = await signInAndGetToken(bridgeRequest, true);

            const grantState = new Map(staff.map(m => [m.mail, { member: m.name, error: "pending" }]));
            const BATCH_SIZE = 10;
            const MAX_ATTEMPTS = 20;
            const RETRY_DELAY_MS = 15000;

            for (let attempt = 1; attempt <= MAX_ATTEMPTS && !stopRequested; attempt++) {
                const pending = staff.filter(m => grantState.get(m.mail).error);
                if (pending.length === 0) break;

                statusEl.textContent = attempt === 1
                    ? `Granting mailbox access to ${pending.length} team member(s)...`
                    : `Retrying ${pending.length} failed grant(s) — attempt ${attempt} of ${MAX_ATTEMPTS} (mailbox may still be provisioning)...`;

                for (let i = 0; i < pending.length && !stopRequested; i += BATCH_SIZE) {
                    const batch = pending.slice(i, i + BATCH_SIZE);
                    await Promise.all(batch.map(async member => {
                        try {
                            await grantMailboxPermissionViaBridge(mailbox, member.mail, bridgeToken, false);
                            grantState.set(member.mail, { member: member.name, error: null });
                        } catch (err) {
                            grantState.set(member.mail, { member: member.name, error: err.message });
                        }
                    }));
                }

                const stillPending = staff.filter(m => grantState.get(m.mail).error);
                if (stillPending.length === 0 || stopRequested) break;

                if (attempt < MAX_ATTEMPTS) {
                    statusEl.textContent = `${stillPending.length} of ${staff.length} still failing — waiting to retry (attempt ${attempt + 1} of ${MAX_ATTEMPTS})...`;
                    await waitUnless(RETRY_DELAY_MS, () => stopRequested);
                } else {
                    result.gaveUp = true;
                }
            }

            result.stoppedByUser = stopRequested;
            result.grants = staff.map(m => grantState.get(m.mail));
        } catch (err) {
            result.grantsError = err.message;
        }

        stopButton.removeEventListener("click", stopHandler);
        stopButton.style.display = "none";

        return result;
    }

    async function createProjectMailboxAndGrantAllStaff(mailboxName, statusEl, stopButton) {
        const result = { mailboxName, mailbox: null, mailboxError: null, mailboxAlreadyExisted: false, grants: [], grantsError: null, stoppedByUser: false, gaveUp: false };

        statusEl.textContent = "Creating project mailbox...";
        try {
            const bridgeToken = await signInAndGetToken(bridgeRequest, true);
            if (!bridgeToken) throw new Error("Could not get permission to create mailboxes.");
            const created = await createSharedMailboxViaBridge(mailboxName, bridgeToken);
            result.mailbox = created.mailbox;
            result.mailboxAlreadyExisted = created.alreadyExisted;
        } catch (err) {
            result.mailboxError = err.message;
            return result;
        }

        const grantResult = await grantAccessToStaffWithRetry(result.mailbox, getAllStaffMembers, "all Summation staff", statusEl, stopButton);
        Object.assign(result, grantResult);
        return result;
    }

    function renderGrantResultsHtml(label, grants, grantsError, stoppedByUser, gaveUp) {
        if (grantsError) {
            return `<div class="warning-box">Could not look up ${label} to add: ${grantsError}. Use Manage Shared Mailbox Members once the mailbox is provisioned.</div>`;
        }
        const failed = grants.filter(g => g.error);
        const succeeded = grants.length - failed.length;
        let html = `<div class="row">Granted ${label} (${grants.length} member(s)) access without automapping — ${succeeded} succeeded, ${failed.length} still failing.</div>`;
        if (failed.length > 0) {
            const reason = stoppedByUser
                ? "You stopped waiting before all grants landed"
                : gaveUp
                    ? "Gave up after repeated retries"
                    : "Still failing";
            html += `<div class="warning-box">${reason} — this is expected if the mailbox hasn't finished provisioning yet. Retry via Manage Shared Mailbox Members once it's ready. Still pending: ${failed.map(f => f.member).join(", ")}.</div>`;
        }
        return html;
    }

    // ---- Action dispatcher ----

    async function runPendingAction() {
        if (!pendingAction) {
            updateStatus("No pending action found. This page is meant to be opened automatically by the Summation Assistant sidebar after clicking Confirm.");
            return;
        }
        if (pendingAction.parseError) {
            updateStatus(`Error: ${pendingAction.parseError} Please go back to the sidebar and try again.`, true);
            return;
        }

        // Consume it so a later re-render of this page can't run it a second time.
        const pending = pendingAction;
        pendingAction = null;

        actionInProgress = true;
        try {
            switch (pending.type) {
                case "createBdProject":
                    await runCreateBdProject(pending.params);
                    break;
                case "convertBdToActive":
                    await runConvertBdToActive(pending.params);
                    break;
                case "convertActiveToArchive":
                    await runConvertActiveToArchive(pending.params);
                    break;
                case "createSharedMailbox":
                    await runCreateSharedMailbox(pending.params);
                    break;
                default:
                    updateStatus(`Error: unrecognized action type "${pending.type}".`, true);
            }
        } catch (err) {
            console.error("Action failed:", err);
            document.getElementById("resultSummary").innerHTML = `<div class="warning-box">Error: ${err.message}</div>`;
            updateStatus("");
        } finally {
            actionInProgress = false;
        }
    }

    // ---- New BD Project ----

    async function runCreateBdProject(params) {
        const { service, combo, nnn, folderName, archivePath, bdRelativePath, internetMessageId, subject } = params;
        updateStatus("Creating project folder...");

        const token = await signInAndGetToken(sitesRequest, true);

        // Race-condition mitigation: recheck immediately before writing.
        const recheck = await getNextProjectNumber(token, combo);
        if (recheck.nextNNN !== nnn) {
            throw new Error("Someone else just took that project number. Please go back to the sidebar and try again.");
        }

        const branchFolderId = await getOrCreateBranchFolder(ARCHIVE_DRIVE_ID, archivePath, token);

        const existing = await graphGetOrNull(
            `https://graph.microsoft.com/v1.0/drives/${ARCHIVE_DRIVE_ID}/root:/${encodePath(archivePath)}/${encodeURIComponent(folderName)}`,
            token
        );
        if (existing) {
            throw new Error(`A folder named "${folderName}" already exists. Please go back to the sidebar and try again.`);
        }

        let bdFolderId, projectFolderWebUrl;
        if (service === "Sustainability") {
            updateStatus("Copying project template...");
            const newFolder = await copyTemplateFolder(archivePath, branchFolderId, folderName, token);
            projectFolderWebUrl = newFolder.webUrl;
            const bdFolder = await graphGetOrNull(
                `https://graph.microsoft.com/v1.0/drives/${ARCHIVE_DRIVE_ID}/items/${newFolder.id}:/Admin/BD`,
                token
            );
            if (!bdFolder) throw new Error("Template was copied, but its Admin/BD folder could not be found — please check the folder manually.");
            bdFolderId = bdFolder.id;
        } else {
            updateStatus("Creating blank project folder...");
            const projectFolder = await createFolder(ARCHIVE_DRIVE_ID, branchFolderId, folderName, token);
            projectFolderWebUrl = projectFolder.webUrl;
            const bdFolder = await createFolder(ARCHIVE_DRIVE_ID, projectFolder.id, "BD", token);
            bdFolderId = bdFolder.id;
        }

        updateStatus("Filing email and attachments...");
        const filingResults = await fileEmailAndAttachmentsViaGraph(ARCHIVE_DRIVE_ID, bdFolderId, internetMessageId, subject, token);

        const statusEl = document.getElementById("status");
        const stopButton = document.getElementById("stopRetryButton");
        const mailboxResult = await createProjectMailboxAndGrantAllStaff(folderName, statusEl, stopButton);

        updateStatus("Done.");
        renderCreateBdProjectResult({ folderName, webUrl: projectFolderWebUrl, filingResults }, mailboxResult);
    }

    function renderCreateBdProjectResult(success, mailboxResult) {
        const { folderName, webUrl, filingResults } = success;
        let html = `<div class="summary-box">
            <div class="row"><span class="label">Created:</span> ${folderName}</div>
            <div class="row">
                <a href="${webUrl}" target="_blank">Open folder in SharePoint</a>
                &nbsp;|&nbsp;
                <button type="button" id="copyLinkButton" class="small-button">Copy Folder Link</button>
                <span id="copyLinkStatus" style="font-size:11px; color:#888; margin-left:6px;"></span>
            </div>`;
        if (filingResults.email) html += `<div class="row">Filed email as: ${filingResults.email}</div>`;
        if (filingResults.attachments.length) html += `<div class="row">Filed attachments: ${filingResults.attachments.join(", ")}</div>`;
        if (filingResults.errors && filingResults.errors.length) {
            html += `<div class="row" style="color:red;">Some items failed to file: ${filingResults.errors.join("; ")}</div>`;
        }
        html += `</div>`;

        if (mailboxResult.mailboxError) {
            html += `<div class="warning-box">Project mailbox not created: ${mailboxResult.mailboxError}</div>`;
        } else {
            html += `<div class="summary-box">
                <div class="row"><span class="label">Project mailbox:</span> ${mailboxResult.mailbox}</div>
                <div class="row">${mailboxResult.mailboxAlreadyExisted
                    ? "This mailbox already existed (from a previous attempt) — skipped creation and went straight to granting access."
                    : "Created as a real Exchange shared mailbox — ready to use now."}</div>
                ${renderGrantResultsHtml("all Summation staff", mailboxResult.grants, mailboxResult.grantsError, mailboxResult.stoppedByUser, mailboxResult.gaveUp)}
            </div>`;
        }

        document.getElementById("resultSummary").innerHTML = html;
        const copyButton = document.getElementById("copyLinkButton");
        if (copyButton) copyButton.addEventListener("click", () => copyLinkToClipboard(webUrl, "copyLinkStatus"));
    }

    // ---- Change BD to Active project (Archive -> Active folder move) ----

    async function runConvertBdToActive(params) {
        const { folderName, archivePath, destPath } = params;
        updateStatus("Checking current state...");

        const token = await signInAndGetToken(sitesRequest, true);

        // Race-condition mitigation: recheck immediately before writing.
        const destExisting = await graphGetOrNull(
            `https://graph.microsoft.com/v1.0/drives/${ACTIVE_DRIVE_ID}/root:/${encodePath(destPath)}/${encodeURIComponent(folderName)}`,
            token
        );
        if (destExisting) {
            throw new Error(`A folder named "${folderName}" already exists in Active. Refusing to convert.`);
        }

        const sourceItem = await graphGetOrNull(
            `https://graph.microsoft.com/v1.0/drives/${ARCHIVE_DRIVE_ID}/root:/${encodePath(archivePath)}/${encodeURIComponent(folderName)}`,
            token
        );
        if (!sourceItem) {
            throw new Error(`Could not find "${folderName}" in Archive anymore — it may have already been converted.`);
        }

        updateStatus("Preparing Active branch folder...");
        const destBranchFolderId = await getOrCreateBranchFolder(ACTIVE_DRIVE_ID, destPath, token);

        updateStatus("Copying folder to Active (this can take a while for large folders)...");
        await copyFolderAcrossDrives(ARCHIVE_DRIVE_ID, sourceItem.id, ACTIVE_DRIVE_ID, destBranchFolderId, folderName, token);

        const newActiveItem = await graphGetOrNull(
            `https://graph.microsoft.com/v1.0/drives/${ACTIVE_DRIVE_ID}/root:/${encodePath(destPath)}/${encodeURIComponent(folderName)}`,
            token
        );
        if (!newActiveItem) {
            throw new Error("Copy reported success, but the folder could not be found in Active. Nothing was deleted from Archive — please check manually.");
        }

        updateStatus("Removing original from Archive...");
        let deleteError = null;
        try {
            await deleteItem(ARCHIVE_DRIVE_ID, sourceItem.id, token);
        } catch (err) {
            deleteError = err.message;
        }

        updateStatus("Done.");
        renderFolderMoveResult({ folderName, webUrl: newActiveItem.webUrl, deleteError }, "Converted", "Active", "Archive");
    }

    // ---- Convert Active to Archive ----

    async function runConvertActiveToArchive(params) {
        const { folderName, activePath, destPath } = params;
        updateStatus("Checking current state...");

        const token = await signInAndGetToken(sitesRequest, true);

        // Race-condition mitigation: recheck immediately before writing.
        const destExisting = await graphGetOrNull(
            `https://graph.microsoft.com/v1.0/drives/${ARCHIVE_DRIVE_ID}/root:/${encodePath(destPath)}/${encodeURIComponent(folderName)}`,
            token
        );
        if (destExisting) {
            throw new Error(`A folder named "${folderName}" already exists in Archive. Refusing to convert.`);
        }

        const sourceItem = await graphGetOrNull(
            `https://graph.microsoft.com/v1.0/drives/${ACTIVE_DRIVE_ID}/root:/${encodePath(activePath)}/${encodeURIComponent(folderName)}`,
            token
        );
        if (!sourceItem) {
            throw new Error(`Could not find "${folderName}" in Active anymore — it may have already been converted.`);
        }

        updateStatus("Preparing Archive branch folder...");
        const destBranchFolderId = await getOrCreateBranchFolder(ARCHIVE_DRIVE_ID, destPath, token);

        updateStatus("Copying folder to Archive (this can take a while for large folders)...");
        await copyFolderAcrossDrives(ACTIVE_DRIVE_ID, sourceItem.id, ARCHIVE_DRIVE_ID, destBranchFolderId, folderName, token);

        const newArchiveItem = await graphGetOrNull(
            `https://graph.microsoft.com/v1.0/drives/${ARCHIVE_DRIVE_ID}/root:/${encodePath(destPath)}/${encodeURIComponent(folderName)}`,
            token
        );
        if (!newArchiveItem) {
            throw new Error("Copy reported success, but the folder could not be found in Archive. Nothing was deleted from Active — please check manually.");
        }

        updateStatus("Removing original from Active...");
        let deleteError = null;
        try {
            await deleteItem(ACTIVE_DRIVE_ID, sourceItem.id, token);
        } catch (err) {
            deleteError = err.message;
        }

        updateStatus("Done.");
        renderFolderMoveResult({ folderName, webUrl: newArchiveItem.webUrl, deleteError }, "Converted", "Archive", "Active");
    }

    function renderFolderMoveResult(success, verb, destLibraryLabel, sourceLibraryLabel) {
        const { folderName, webUrl, deleteError } = success;
        let html = `<div class="summary-box">
            <div class="row"><span class="label">${verb}:</span> ${folderName}</div>
            <div class="row">
                <a href="${webUrl}" target="_blank">Open folder in SharePoint (${destLibraryLabel})</a>
                &nbsp;|&nbsp;
                <button type="button" id="copyLinkButton" class="small-button">Copy Folder Link</button>
                <span id="copyLinkStatus" style="font-size:11px; color:#888; margin-left:6px;"></span>
            </div>`;
        if (deleteError) {
            html += `<div class="warning-box">Copied to ${destLibraryLabel} successfully, but could not remove the original from ${sourceLibraryLabel} (${deleteError}). Please delete "${folderName}" from ${sourceLibraryLabel} manually to avoid a duplicate.</div>`;
        } else {
            html += `<div class="row">Original removed from ${sourceLibraryLabel}.</div>`;
        }
        html += `</div>`;
        document.getElementById("resultSummary").innerHTML = html;

        const copyButton = document.getElementById("copyLinkButton");
        if (copyButton) copyButton.addEventListener("click", () => copyLinkToClipboard(webUrl, "copyLinkStatus"));
    }

    // ---- Create Shared Mailbox (standalone wizard) ----

    async function runCreateSharedMailbox(params) {
        const { mailboxName, selectedTeam } = params;
        const departments = selectedTeam === "All" ? ["Sustainability", "Energy"] : [selectedTeam];
        const teamLabel = selectedTeam === "All" ? "the Sustainability & Energy teams" : `the ${selectedTeam} team`;

        updateStatus("Creating project mailbox...");
        const result = { mailbox: null, mailboxError: null, mailboxAlreadyExisted: false, grants: [], grantsError: null, stoppedByUser: false, gaveUp: false };
        try {
            const bridgeToken = await signInAndGetToken(bridgeRequest, true);
            if (!bridgeToken) throw new Error("Could not get permission to create mailboxes.");
            const created = await createSharedMailboxViaBridge(mailboxName, bridgeToken);
            result.mailbox = created.mailbox;
            result.mailboxAlreadyExisted = created.alreadyExisted;
        } catch (err) {
            result.mailboxError = err.message;
            renderCreateSharedMailboxResult(result, teamLabel);
            updateStatus("");
            return;
        }

        const statusEl = document.getElementById("status");
        const stopButton = document.getElementById("stopRetryButton");
        const grantResult = await grantAccessToStaffWithRetry(
            result.mailbox,
            token => getStaffByDepartments(departments, token),
            teamLabel,
            statusEl,
            stopButton
        );
        Object.assign(result, grantResult);

        updateStatus("Done.");
        renderCreateSharedMailboxResult(result, teamLabel);
    }

    function renderCreateSharedMailboxResult(result, teamLabel) {
        if (result.mailboxError) {
            document.getElementById("resultSummary").innerHTML = `<div class="warning-box">Error: ${result.mailboxError}</div>`;
            return;
        }
        document.getElementById("resultSummary").innerHTML = `<div class="summary-box">
            <div class="row"><span class="label">Mailbox:</span> ${result.mailbox}</div>
            <div class="row">${result.mailboxAlreadyExisted
                ? "This mailbox already existed (from a previous attempt) — skipped creation and went straight to granting access."
                : "Created as a real Exchange shared mailbox — ready to use now."}</div>
            ${renderGrantResultsHtml(teamLabel, result.grants, result.grantsError, result.stoppedByUser, result.gaveUp)}
        </div>`;
    }
  </script>
